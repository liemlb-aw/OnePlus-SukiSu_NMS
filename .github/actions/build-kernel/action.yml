  - name: Add Droidspaces support
    shell: bash
    if: ${{ env.OP_DS == 'true' }}
    run: |
      echo "::group::Add Droidspaces Support"
      set -euo pipefail
      cd "$COMMON_KERNEL_FOLDER"

      echo "Applying patch to enable SYSVIPC without breaking ABI"
      case "$OP_BRANCH" in
        wild/sm8850|wild/sm8845)
          if ! patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_a16-6.12.patch"; then
            echo "::error::fix_sysvipc_kabi_a16-6.12 patch failed. Dumping all .rej files:"
            find . -name "*.rej" -exec echo "=== {} ===" \; -exec cat {} \;
            exit 1
          fi
          ;;
        wild/sm8550|wild/sm7550)
          if ! patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_1_2_3.patch"; then
            echo "::error::fix_sysvipc_kabi_1_2_3 patch failed. Dumping all .rej files:"
            find . -name "*.rej" -exec echo "=== {} ===" \; -exec cat {} \;
            exit 1
          fi
          ;;
        wild/sm8450|wild/sm8475|wild/mt6895|wild/mt6983|wild/mt6789)
          if [ "$ANDROID_VER" = "android12" ] && [ "$KERNEL_VER" = "5.10" ]; then
            if ! patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_bypass_a16-6.12_below.patch"; then
              echo "::error::fix_sysvipc_kabi_bypass_a16-6.12_below patch failed. Dumping all .rej files:"
              find . -name "*.rej" -exec echo "=== {} ===" \; -exec cat {} \;
              exit 1
            fi
            if ! patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_abi_padding_for_posix_mqueue.patch"; then
              echo "::error::fix_abi_padding_for_posix_mqueue patch failed. Dumping all .rej files:"
              find . -name "*.rej" -exec echo "=== {} ===" \; -exec cat {} \;
              exit 1
            fi
          else
            if ! patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch"; then
              echo "::error::fix_sysvipc_kabi_6_7_8 patch failed. Dumping all .rej files:"
              find . -name "*.rej" -exec echo "=== {} ===" \; -exec cat {} \;
              exit 1
            fi
          fi
          ;;
        *)
          if ! patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch"; then
            echo "::error::fix_sysvipc_kabi_6_7_8 patch failed. Dumping all .rej files:"
            find . -name "*.rej" -exec echo "=== {} ===" \; -exec cat {} \;
            exit 1
          fi
          ;;
      esac

      echo "Patch to fix kernel panic caused by oplus_bsp_midas"
      if ! patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/droidspaces/0001-Return-ghost-task-if-task-is-null-and-is-requested-b.patch"; then
