  - name: Disable GPUEB
    shell: bash
    if: ${{ env.KERNEL_VER == '5.10' && (startsWith(env.OP_SOC, 'dimensity') || startsWith(env.OP_SOC, 'helio')) }}
    run: |
      set -euo pipefail
      echo "Disabling GPUEB for MTK kernel 5.10"
      sed -i '/obj-y.*gpueb/d' "$COMMON_KERNEL_FOLDER/drivers/gpu/mediatek/Makefile"

  - name: Disable Vendor / Kernel Modules
    shell: bash
    run: |
      set -euo pipefail
      echo "Disabling Vendor / Kernel Modules"
      cd "$COMMON_KERNEL_FOLDER"

      RISKY_MODULES=("coresight" "rust_binder" "msm_kgsl" "camera")

      declare -a modules=()
      IFS=',' read -ra ADDR <<< "$OP_BLACKLIST_MODULES"
      for mod in "${ADDR[@]}"; do
        [[ -n "$mod" ]] && modules+=("$mod")
      done

      declare -a validated_modules=()
      for mod in "${modules[@]}"; do
        is_risky=false
        
        for risky in "${RISKY_MODULES[@]}"; do
          if [ "$mod" = "$risky" ]; then
            is_risky=true
            echo "⚠️ WARNING: Blocked attempt to blacklist protected module: $mod"
            break
          fi
        done
        
        if [ "$is_risky" = false ]; then
          validated_modules+=("$mod")
        fi
      done

      if [ ${#validated_modules[@]} -eq 0 ]; then
        echo "No modules to blacklist - skipping vendor-module debloat (no defconfig change, no patch)."
      else
        RAW_JOINED=$(IFS=,; echo "${validated_modules[*]}")
        RESULT_LIST="\"${RAW_JOINED}\""

        echo "Disabling following kernel modules: ${RESULT_LIST}"
        echo "CONFIG_DEBLOAT_VENDOR_MODULES=${RESULT_LIST}" >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"

        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"
        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          DEBLOAT_PATCH="$BOUTEILLE_KERNEL_PATCHES_FOLDER/experimental/0001-Support-conditional-vendor-modules-blacklisting-5.15-and-below.patch"
        else
          DEBLOAT_PATCH="$BOUTEILLE_KERNEL_PATCHES_FOLDER/experimental/0001-Support-conditional-vendor-modules-blacklisting-6.1-and-above.patch"
        fi
        if [ ! -f "$DEBLOAT_PATCH" ]; then
          echo "::error::Vendor-module debloat patch not found: $DEBLOAT_PATCH"
          exit 1
        fi
        patch -p1 < "$DEBLOAT_PATCH"
      fi

  - name: 🔧 Add ADIOS I/O Scheduler
    shell: bash
    if: ${{ inputs.enable_adios == true || inputs.enable_adios == 'true' }}
    run: |
      set -euo pipefail
      echo "::group::Add ADIOS I/O Scheduler"

      cd "$COMMON_KERNEL_FOLDER"

      if [ -z "${ADIOS_PATCHES_FOLDER:-}" ]; then
        echo "::error::ADIOS_PATCHES_FOLDER is not set"
        exit 1
      fi

      if [ ! -d "$ADIOS_PATCHES_FOLDER" ]; then
        echo "::error::ADIOS patches folder not found: $ADIOS_PATCHES_FOLDER"
        exit 1
      fi

      PATCH_FILE=""

      case "${KERNEL_VER}" in
        "6.12")
          PATCH_FILE="$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.12.patch"
          ;;
        "6.6")
          PATCH_FILE="$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.6.patch"
          ;;
        "5.15")
          PATCH_FILE="$ADIOS_PATCHES_FOLDER/adios_ioscheduler_5.15.patch"
          ;;
        "5.10")
          PATCH_FILE="$ADIOS_PATCHES_FOLDER/adios_ioscheduler_5.10.patch"
          ;;
        "6.1")
          if [ "${TKERNEL_VER:-}" = "6.1.115" ] \
            && { [[ "${OP_BRANCH:-}" == *mt* ]] || [[ "${OP_SOC:-}" == *dimensity* ]] \
              || [[ "${OP_SOC:-}" == *mediatek* ]] || [[ "${OP_SOC:-}" == *mt* ]]; }; then
            PATCH_FILE="$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.1_mt6989.patch"
          elif [ "${TKERNEL_VER:-}" = "6.1.57" ] || [ "${TKERNEL_VER:-}" = "6.1.75" ]; then
            PATCH_FILE="$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.1_old.patch"
          else
            PATCH_FILE="$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.1.patch"
          fi
          ;;
        *)
          echo "::warning::ADIOS not configured for kernel ${KERNEL_VER} (supported: 5.10, 5.15, 6.1, 6.6, 6.12)"
          echo "::endgroup::"
          exit 0
          ;;
      esac

      if [ ! -f "$PATCH_FILE" ]; then
        echo "::error::ADIOS patch not found: $PATCH_FILE"
        find "$ADIOS_PATCHES_FOLDER" -maxdepth 3 -type f -iname "*adios*" -print || true
        exit 1
      fi

      if [ -f "block/adios.c" ]; then
        echo "ADIOS source already exists. Skipping."
      else
        cp "$PATCH_FILE" ./adios.patch

        if patch -p1 --ignore-whitespace -F 3 < adios.patch 2>&1 | tee /tmp/adios_patch.log; then
          echo "ADIOS patch applied successfully"
        else
          echo "::warning::ADIOS patch reported an issue"
          if grep -q "malformed patch" /tmp/adios_patch.log; then
            patch -p1 --force --ignore-whitespace < adios.patch || true
          fi
          if find . -name "*.rej" -print -quit | grep -q .; then
            echo "::error::ADIOS patch failed. Reject files:"
            find . -name "*.rej" -exec echo "=== {} ===" \; -exec cat {} \;
            exit 1
          fi
        fi

        rm -f adios.patch
      fi

      DEFCONFIG="$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"

      if ! grep -q "^CONFIG_MQ_IOSCHED_ADIOS=" "$DEFCONFIG"; then
        {
          echo "CONFIG_MQ_IOSCHED_ADIOS=y"
          echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y"
        } >> "$DEFCONFIG"
      fi

      echo "✅ ADIOS I/O scheduler setup completed"
      echo "::endgroup::"

  - name: Patch dry-run verdict
    if: ${{ inputs.patch_dry_run == true || inputs.patch_dry_run == 'true' }}
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Patch dry-run verdict"
      VERDICT="$DEBUG_ARTIFACTS_DIR/patch_dry_run_${OP_MODEL}_${OP_OS_VERSION}.txt"
      failed_patches="$(grep -Ec '\|failed$' "$PS_FILE" 2>/dev/null || true)"
      skipped_patches="$(grep -Ec '\|skipped$' "$PS_FILE" 2>/dev/null || true)"
      {
        echo "device=$OP_MODEL os=$OP_OS_VERSION"
        echo "kernel=${ANDROID_VER}-${TKERNEL_VER}"
        echo "== per-patch status =="
        cat "$PS_FILE" 2>/dev/null || true
        echo "== summary =="
        echo "failed_patches=${failed_patches:-0}"
        echo "skipped_patches=${skipped_patches:-0}"
        echo "adios=${ADIOS_ENABLED:-not-applied}"
        echo "bbrv3=${BBR3_APPLIED:-not-applied}"
        echo "bore=${BORE_APPLIED:-not-applied}"
        echo "bore_skipped=${BORE_SKIPPED:-none}"
        echo "adios_skipped=${ADIOS_SKIPPED:-none}"
        if [ "${failed_patches:-0}" -gt 0 ] || [ "${skipped_patches:-0}" -gt 0 ]; then
          echo "result=PARTIAL_PATCHES_APPLIED"
        else
          echo "result=ALL_PATCHES_APPLIED_CLEANLY"
        fi
      } > "$VERDICT"
      cat "$VERDICT"
      if [ "${failed_patches:-0}" -gt 0 ] || [ "${skipped_patches:-0}" -gt 0 ]; then
        echo "::notice::patch_dry_run=true — patches applied with soft-skips/soft-fails for ${OP_MODEL} ${OP_OS_VERSION} (see verdict). Compilation intentionally skipped."
      else
        echo "::notice::patch_dry_run=true — every requested patch applied cleanly for ${OP_MODEL} ${OP_OS_VERSION}. Compilation intentionally skipped."
      fi
      echo "::endgroup::"

  - name: Build Kernel
    id: build_kernel_step
    shell: bash
    env:
      PYTHONWARNINGS: "ignore:invalid escape sequence"
    run: |
      set -euo pipefail
      echo "::group::Build kernel with ccache optimization"

      cd "$COMMON_KERNEL_FOLDER"
      : > "$COMMON_KERNEL_FOLDER/.scmversion"

      export PYTHONWARNINGS="${PYTHONWARNINGS}"

      echo "Getting last commit timestamp from kernel source..."
      COMMIT_TIMESTAMP=$(git log -1 --format=%ct 2>/dev/null || echo "$(date +%s)")
      COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S' 2>/dev/null || date -u '+%Y-%m-%d %H:%M:%S')
      COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")

      WORKSPACE="${GITHUB_WORKSPACE}"
      MAP="-fdebug-prefix-map=${WORKSPACE}=."
      MPMAP="-fmacro-prefix-map=${WORKSPACE}=."
      FPMAP="-ffile-prefix-map=${WORKSPACE}=."

      export KCFLAGS="${KCFLAGS:-} $MAP $MPMAP $FPMAP -no-canonical-prefixes -fdiagnostics-color=never -Qunused-arguments -Wno-unused-command-line-argument -D__ANDROID_COMMON_KERNEL__"
      export KCPPFLAGS="${KCPPFLAGS:-} $MAP $MPMAP $FPMAP"

      export LLVM=1 LLVM_IAS=1
      export ARCH=arm64 SUBARCH=arm64
      export CROSS_COMPILE=aarch64-linux-gnu-
      export PAHOLE="$KERNEL_PLATFORM_FOLDER/prebuilts/kernel-build-tools/linux-x86/bin/pahole"
      export LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm 
      export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      set +u
      source "$KERNEL_PLATFORM_FOLDER/build/kernel/_setup_env.sh" 2>/dev/null || true
      set -u

      echo '#!/bin/bash' > "$COMMON_KERNEL_FOLDER/ld-wrapper"
      echo 'ld.lld "$@" --thinlto-jobs=$(nproc --all)' >> "$COMMON_KERNEL_FOLDER/ld-wrapper"
      chmod +x "$COMMON_KERNEL_FOLDER/ld-wrapper"

      KERNEL_BUILD_DATE=$(date -u)
      export SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP
      if [ -n "${{ inputs.build_timestamp }}" ]; then
        export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_timestamp }}"
        echo "📅 Using custom build timestamp: $KBUILD_BUILD_TIMESTAMP"
      elif [ -n "${OP_KTIMESTAMP:-}" ]; then
        export KBUILD_BUILD_TIMESTAMP="$OP_KTIMESTAMP"
        echo "📅 Using this model's stock kernel timestamp: $KBUILD_BUILD_TIMESTAMP"
      else
        export KBUILD_BUILD_TIMESTAMP="$KERNEL_BUILD_DATE"
        echo "📅 Using current UTC build timestamp: $KBUILD_BUILD_TIMESTAMP"
      fi
      echo "EFFECTIVE_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP" >> "$GITHUB_ENV"
      export KBUILD_BUILD_USER="${BUILD_USER:-kernel}"
      export KBUILD_BUILD_HOST="${BUILD_HOST:-kleaf}"
      export KBUILD_BUILD_VERSION=1
      echo "🔢 SOURCE_DATE_EPOCH: $SOURCE_DATE_EPOCH"
      echo "👤 Build user: $KBUILD_BUILD_USER"
      echo "🖥️  Build host: $KBUILD_BUILD_HOST"

      export CC="ccache clang"
      export CXX="ccache clang++"
      export HOSTCC="ccache clang"
      export HOSTCXX="ccache clang++"

      if [ "${{ inputs.clean }}" = "false" ]; then
        echo "🚀 ccache-accelerated build"
      else
        echo "🧹 Clean build mode"
      fi

      OUT=out
      mkdir -p "$OUT"

      echo "============================================"
      echo "🔍 Compiler & ccache Verification"
      echo "============================================"
      echo "PATH: ${PATH:0:200}..."
      echo "which clang: $(which clang)"
      echo "CC: $CC"
      echo "CXX: $CXX"
      echo "CCACHE_BASEDIR: ${CCACHE_BASEDIR:-not set}"
      echo ""

      echo "ccache wrapper test:"
      clang --version 2>&1 | head -n1 || true
      echo ""
      echo "ccache configuration:"
      ccache -p | grep -E "(compression|direct_mode|readonly_direct|depend|sloppiness)" || true
      echo ""
      echo "ccache pre-build status:"
      ccache -s | head -n 20
      echo "============================================"

      make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" O="$OUT" gki_defconfig

      LOCAL_LOCALVERSION="${CUSTOM_LOCALVERSION:--OP-WILD}"
      if [ -n "${LOCAL_LOCALVERSION:-}" ]; then
        scripts/config --file "$OUT/.config" --set-str LOCALVERSION "${LOCAL_LOCALVERSION}"
        scripts/config --file "$OUT/.config" -d LOCALVERSION_AUTO || true
        sed -i 's/scm_version="$(scm_version --short)"/scm_version=""/' scripts/setlocalversion
      fi

      if [ "${{ inputs.optimize_level }}" = "O3" ]; then
        scripts/config --file "$OUT/.config" -d CC_OPTIMIZE_FOR_PERFORMANCE -e CC_OPTIMIZE_FOR_PERFORMANCE_O3
        KCFLAGS_EXTRA="-O3"
      else
        scripts/config --file "$OUT/.config" -e CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3
        KCFLAGS_EXTRA="-O2"
      fi

      case "$OP_BRANCH" in
        wild/sm8750|wild/sm8850|wild/sm8845)
          if echo 'int main(void){return 0;}' | clang -mcpu=oryon-1 --target=aarch64-linux-gnu -fsyntax-only -x c - >/dev/null 2>&1; then
            KCFLAGS_EXTRA="-mcpu=oryon-1 ${KCFLAGS_EXTRA}"
            echo "🧠 -mcpu=oryon-1 enabled for $OP_BRANCH"
          else
            echo "::warning::$CLANG_VERSION does not accept -mcpu=oryon-1; building $OP_BRANCH generic"
          fi
          ;;
      esac

      scripts/config --file "$OUT/.config" -e LTO_CLANG -d LTO_CLANG_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL

      case "${{ env.OP_LTO}}" in
        "none") scripts/config --file "$OUT/.config" -e LTO_CLANG_NONE ;;
        "thin") scripts/config --file "$OUT/.config" -e LTO_CLANG_THIN ;;
        "full") scripts/config --file "$OUT/.config" -e LTO_CLANG_FULL ;;
        *)
          echo "::error::Unsupported LTO option: ${{ env.OP_LTO}}"
          exit 1
          ;;
      esac


      disable_list=(
        CONFIG_REGMAP_KUNIT
        CONFIG_INPUT_KUNIT_TEST
        CONFIG_SND_SOC_TOPOLOGY_KUNIT_TEST
        CONFIG_SND_SOC_UTILS_KUNIT_TEST
        CONFIG_HID_KUNIT_TEST
        CONFIG_RTC_LIB_KUNIT_TEST
        CONFIG_CLK_KUNIT_TEST
        CONFIG_CLK_GATE_KUNIT_TEST
        CONFIG_IIO_FORMAT_KUNIT_TEST
        CONFIG_EXT4_KUNIT_TESTS
        CONFIG_FAT_KUNIT_TEST
      )

      for sym in "${disable_list[@]}"; do
        scripts/config --file "$OUT/.config" -d "$sym" 2>/dev/null || true
      done

      make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" O="$OUT" olddefconfig

      for sym in CONFIG_KSU; do
        grep -q "^${sym}=y" "$OUT/.config" \
          || { echo "::error::${sym} was dropped by olddefconfig (not defined by the KSU source?)"; exit 1; }
      done

      if [ "$OP_NMS" = true ]; then
        bash "$BOUTEILLE_KERNEL_PATCHES_FOLDER/scripts/apply_nomount_stack.sh" assert-config
      fi

      KCFLAGS="$KCFLAGS -Wno-error -pipe ${KCFLAGS_EXTRA}"
      KCPPFLAGS="$KCPPFLAGS -DCONFIG_OPTIMIZE_INLINING"

      echo "============================================"
      echo "🔧 Build Configuration"
      echo "============================================"
      echo "Device: ${OP_MODEL}"
      echo "Kernel: ${KERNEL_FULL_VER}"
      echo "Threads: $(nproc --all)"
      echo "Optimization: ${{ inputs.optimize_level }}"
      echo "KCFLAGS: ${KCFLAGS:0:150}..."
      echo "KCPPFLAGS: ${KCPPFLAGS:0:150}..."
      echo "Timestamp: $KBUILD_BUILD_TIMESTAMP"
      echo "Workspace: $WORKSPACE"

      echo "ccache: ENABLED"
      echo "  Dir: $CCACHE_DIR"
      echo "  Base: $CCACHE_BASEDIR"
      echo "  Max size: $CCACHE_MAXSIZE"
      echo "  Compression: zstd level 3"
      echo "  Features: readonly_direct, file_clone, inode_cache, depend"
      echo "============================================"

      if [ ! -d "$CCACHE_DIR" ] || [ -z "$(find "$CCACHE_DIR" -type f 2>/dev/null | head -n1)" ]; then
        echo "🔥 Priming cache with header preprocessing..."
        make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" -C "$COMMON_KERNEL_FOLDER" O="$OUT" headers_install prepare 2>&1 | head -n 20 || true
        echo ""
      fi

      BUILD_START=$(date +%s)
      set -o pipefail

      if [ "${{ inputs.debug }}" == "true" ]; then
        make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" Image modules 2>&1 | tee build.log
        make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" -j"$(nproc --all)" O="$COMMON_KERNEL_FOLDER/out" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" INSTALL_MOD_PATH="$COMMON_KERNEL_FOLDER/out/install" modules_install 2>&1 | tee install.log
        
        cp build.log "$DEBUG_ARTIFACTS_FOLDER/build.log"
        cp install.log "$DEBUG_ARTIFACTS_FOLDER/install.log"
        rsync -av --no-links --exclude='build' "$COMMON_KERNEL_FOLDER/out/install/lib/modules"/*/ "$DEBUG_ARTIFACTS_FOLDER"
        cp "$COMMON_KERNEL_FOLDER/out/vmlinux" "$DEBUG_ARTIFACTS_FOLDER/vmlinux"
        cp "$COMMON_KERNEL_FOLDER/out/Module.symvers" "$DEBUG_ARTIFACTS_FOLDER/Module.symvers"
        cp "$COMMON_KERNEL_FOLDER/out/System.map" "$DEBUG_ARTIFACTS_FOLDER/System.map"
        
        ls -la "$DEBUG_ARTIFACTS_FOLDER"
      else
        make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" Image 2>&1 | tee build.log
      fi

      BUILD_END=$(date +%s)
      BUILD_TIME=$((BUILD_END - BUILD_START))

      echo "BUILD_START=$BUILD_START" >> "$GITHUB_ENV"
      echo "BUILD_END=$BUILD_END" >> "$GITHUB_ENV"
      echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"

      IMG="$OUT/arch/arm64/boot/Image"
      if [ ! -f "$IMG" ]; then
        echo "::error::Kernel Image missing"
        echo "::group::Last 100 lines of build log"
        tail -n 100 build.log || echo "Build log not available"
        echo "::endgroup::"
        exit 1
      fi

      IMG_SIZE=$(stat -c%s "$IMG")

      echo "============================================"
      echo "✅ Build Completed Successfully"
      echo "============================================"
      echo "Duration: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
      echo "Image: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"

      echo ""
      echo "📊 ccache Post-Build Statistics"
      echo "============================================"
      ccache -s
      echo "============================================"
      echo "::endgroup::"

  - name: 📊 ccache Post-Build Statistics
    id: ccache_stats
    if: ${{ success() && (inputs.clean == false || inputs.clean == 'false') }}
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::ccache final statistics"

      export CCACHE_DIR="${{ env.CCACHE_DIR }}"

      echo "Clear Temporary cache files..."
      ccache -c

      echo "Perform ccache eviction!"
      ccache --evict-older-than 10800s

      if [ "${{ inputs.debug }}" == "true" ]; then
        if [ -f "${{ env.CCACHE_LOGFILE }}" ]; then
          echo "Rename ccache log"
          LOG_DIR=$(dirname "${{ env.CCACHE_LOGFILE }}")
          NEW_LOG_NAME="${{ env.OP_MODEL }}_${{ env.OP_OS_VERSION }}_${{ env.KERNEL_FULL_VER }}_ccache.log"
          mv "${{ env.CCACHE_LOGFILE }}" "$LOG_DIR/$NEW_LOG_NAME"
          echo "CCACHE_LOGFILE=$LOG_DIR/$NEW_LOG_NAME" >> $GITHUB_ENV
        else
          echo "⚠ ccache log not found, skipping rename."
        fi
      fi

      STATS="$(ccache -s)"

      CACHEABLE=$(echo "$STATS" | awk '/Cacheable calls:/ {
        match($0, /[0-9]+/); 
        print substr($0, RSTART, RLENGTH)
      }' | head -n1)

      HITS=$(echo "$STATS" | awk '/^[[:space:]]*Hits:/ {
        match($0, /[0-9]+/); 
        print substr($0, RSTART, RLENGTH)
      }' | head -n1)

      DIRECT=$(echo "$STATS" | awk '/Direct:/ {
        match($0, /[0-9]+/); 
        print substr($0, RSTART, RLENGTH)
      }' | head -n1)

      if [ "${CACHEABLE:-0}" -gt 0 ]; then
        HIT_RATE=$(awk -v h="${HITS:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (h/c)*100}')
        DIRECT_RATE=$(awk -v d="${DIRECT:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (d/c)*100}')
      else
        HIT_RATE="0.0"
        DIRECT_RATE="0.0"
      fi

      echo "hit_rate=${HIT_RATE}%" >> "$GITHUB_OUTPUT"
      echo "direct_rate=${DIRECT_RATE}%" >> "$GITHUB_OUTPUT"

      echo "::endgroup::"

      echo "## 📊 ccache Statistics" >> $GITHUB_STEP_SUMMARY
      echo "" >> $GITHUB_STEP_SUMMARY
      echo '```' >> $GITHUB_STEP_SUMMARY
      ccache -s >> $GITHUB_STEP_SUMMARY
      echo '```' >> $GITHUB_STEP_SUMMARY

  - name: Collect Build Stats / Validate Image
    id: collect_stats
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Collect Build stats"
      IMG="$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image"

      if [ -f "$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image" ]; then
        IMG="$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image"
      elif [ -f "$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image" ]; then
        IMG="$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image"
      fi

      if [ -f "$COMMON_KERNEL_FOLDER/build.log" ]; then
        WARNINGS_COUNT="$(grep -iE '\bwarning:' "$COMMON_KERNEL_FOLDER/build.log" 2>/dev/null \
          | grep -cvE '(Kconfig|defconfig):[0-9]+:warning:' || true)"
        [ -n "$WARNINGS_COUNT" ] || WARNINGS_COUNT="0"
      else
        WARNINGS_COUNT="0"
      fi

      if [ ! -f "$IMG" ]; then
        echo "::error::Kernel Image not found at: $IMG"
        exit 1
      fi

      if ! file "$IMG" | grep -qi 'ARM64'; then
        echo "::error::Image is not ARM64 format"
        file "$IMG"
        exit 1
      fi

      IMG_SIZE=$(stat -c %s "$IMG")
      MIN_SIZE=6102400
      if [ "$IMG_SIZE" -lt "$MIN_SIZE" ]; then
        echo "::error::Image size too small: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
        exit 1
      fi

      IMG_SHA256=$(sha256sum "$IMG" | awk '{print $1}')
      BUILD_TIME="${BUILD_TIME:-0}"

      KERNEL_UNAME=$(strings "$IMG" | grep -E 'Linux version.*#' | tail -n1)
      echo "Kernel Uname: $KERNEL_UNAME"
      echo "KERNEL_UNAME=$KERNEL_UNAME" >> "$GITHUB_ENV"

      printf 'warnings_count=%s\n' "$WARNINGS_COUNT" >> "$GITHUB_OUTPUT"
      printf 'image_sha256=%s\n' "$IMG_SHA256" >> "$GITHUB_OUTPUT"
      printf 'build_time=%s\n' "$BUILD_TIME" >> "$GITHUB_OUTPUT"

      echo "✅ Validation passed:"
      echo "   - Warnings: $WARNINGS_COUNT"
      echo "   - Image size: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
      echo "   - SHA256: $IMG_SHA256"
      echo "   - Build time: ${BUILD_TIME}s"
      echo "::endgroup::"

  - name: Build susfs_guard_lkm.ko
    id: build_susfs_lkm
    if: inputs.susfs_lkm_ref != ''
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Build susfs_guard_lkm.ko against this kernel"

      # The module is optional; the kernel is not.  A composite action cannot carry
      # continue-on-error per step, so every bail below goes through this: it annotates
      # loudly, records why for the summary, and exits 0 so the Image still ships.
      susfs_bail() {
        echo "::error::susfs_guard_lkm.ko NOT produced - $1"
        echo "SUSFS_KO_STATUS=failed: $1" >> "$GITHUB_ENV"
        echo "::endgroup::"
        exit 0
      }

      OUT="$COMMON_KERNEL_FOLDER/out"

      # A normal (debug=false) build runs `make Image` only, so it stops after
      # `MODPOST vmlinux.symvers` and never writes Module.symvers - that one is a
      # `make modules` artifact.  vmlinux.symvers already lists every EXPORT_SYMBOL of
      # this vmlinux with its CRC, module_layout included, which is precisely what an
      # out-of-tree modpost reads, so seed it rather than forcing a modules build.
      if [ ! -f "$OUT/Module.symvers" ] && [ -f "$OUT/vmlinux.symvers" ]; then
        cp "$OUT/vmlinux.symvers" "$OUT/Module.symvers"
        echo "seeded Module.symvers from vmlinux.symvers ($(wc -l < "$OUT/Module.symvers") symbols)"
      fi
      if [ ! -f "$OUT/Module.symvers" ]; then
        susfs_bail "neither Module.symvers nor vmlinux.symvers exists in $OUT - without kernel symbol CRCs the .ko gets no __versions and a CONFIG_MODVERSIONS kernel refuses it"
      fi
      if ! grep -q "	module_layout	" "$OUT/Module.symvers"; then
        susfs_bail "module_layout has no CRC in $OUT/Module.symvers - that is the one symbol check_modstruct_version() looks up, so the load would fail"
      fi

      # Same reason as Module.symvers: `make Image` never needs scripts/module.lds, so it
      # is absent and modfinal cannot link any .ko - it fails with the misleading
      # "No rule to make target ... .ko, needed by __modfinal".  modules_prepare is the
      # target that emits it; asking for scripts/module.lds directly does not work with O=.
      if [ ! -f "$OUT/scripts/module.lds" ]; then
        make -C "$COMMON_KERNEL_FOLDER" \
          LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" \
          O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 modules_prepare
        echo "generated $OUT/scripts/module.lds via modules_prepare"
      fi

      SUSFS_SRC="$GITHUB_WORKSPACE/susfs4ksu-lkm"
      rm -rf "$SUSFS_SRC"
      git clone --depth 1 -b "${{ inputs.susfs_lkm_ref }}" \
        https://github.com/Bouteillepleine/susfs4ksu-lkm.git "$SUSFS_SRC"
      echo "susfs source: $(git -C "$SUSFS_SRC" log --oneline -1)"

      export ARCH=arm64 SUBARCH=arm64
      export LLVM=1 LLVM_IAS=1
      # CROSS_COMPILE matters on 5.10 and nowhere else: that Makefile builds clang's
      # --target from it, so without it clang compiles arm64 headers for the HOST and
      # every atomic_lse.h asm dies with "unknown register name 'x0'". 5.15 and newer
      # derive the target from ARCH, which is why only android12-5.10 failed. Same
      # value the kernel's own build exports.
      export CROSS_COMPILE=aarch64-linux-gnu-

      # KBUILD_MODPOST_WARN=1 is REQUIRED, not a shortcut: the module deliberately
      # references unexported symbols (kallsyms_lookup_name, init_mm, saved_boot_config,
      # task_work_add, ...) which its userspace loader rewrites to absolute addresses
      # before init_module(2).  modpost treats those as errors by default.  Downgrading
      # them does NOT cost the CRCs - modpost still emits __versions entries for every
      # symbol it CAN resolve from Module.symvers, module_layout included, which is what
      # this kernel's check_modstruct_version() looks up.
      # The compile is the likeliest thing to fail on a kernel the module has never been
      # built against. Measured across a full A16 matrix: every android12-5.10 device
      # fails here with "unknown register name 'x0' in asm" through atomic_lse.h - the
      # module build is not targeting aarch64 on those trees - while 5.15, 6.1, 6.6 and
      # 6.12 all build clean. Everything AFTER make was guarded and make itself was not,
      # so one unbuildable device failed its whole kernel and blocked the release.
      # Guard it too: the Image still ships, just without the module.
      if ! make -C "$COMMON_KERNEL_FOLDER" \
           LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" \
           O="$OUT" M="$SUSFS_SRC/kernel" \
           KBUILD_MODPOST_WARN=1 \
           -j"$(nproc --all)" modules 2>&1 | tee "$GITHUB_WORKSPACE/susfs-build.log" | tail -n 40; then
        susfs_bail "the module did not compile against this kernel - see susfs-build.log"
      fi

      KO="$SUSFS_SRC/kernel/susfs_guard_lkm.ko"
      if [ ! -f "$KO" ]; then
        susfs_bail "susfs_guard_lkm.ko was not produced"
      fi

      echo "--- modinfo ---"
      modinfo "$KO" 2>/dev/null | grep -E "vermagic|name|description|import_ns" || true
      # (1) Everything else proves the module is LOADABLE; nothing proved it belongs to
      # THIS kernel.  Three builders emit the same release string with different struct
      # layouts, so compare against the release this build itself produced.
      REL_FILE="$OUT/include/config/kernel.release"
      [ -f "$REL_FILE" ] || susfs_bail "$REL_FILE is missing, so the module cannot be proven to match this kernel"
      KREL=$(tr -d ' \r\n' < "$REL_FILE")
      KOVM=$(modinfo "$KO" 2>/dev/null | sed -n 's/^vermagic: *//p' | awk '{print $1}')
      [ -n "$KOVM" ] || susfs_bail "the module carries no vermagic"
      [ "$KOVM" = "$KREL" ] || susfs_bail "vermagic mismatch - module says '$KOVM', this kernel is '$KREL'"
      echo "--- vermagic matches this kernel: $KREL ---"

      echo "--- version sections (must be present, or a MODVERSIONS kernel refuses the load) ---"
      readelf -SW "$KO" | awk '/__versions|__version_ext/ {print "  "$2" size="$6}'
      VERS=$(readelf -SW "$KO" | grep -c "__versions" || true)
      if [ "${VERS:-0}" = "0" ]; then
        susfs_bail "no __versions section - check_modstruct_version() will take the try_to_force_load() path and this kernel has CONFIG_MODULE_FORCE_LOAD off, so the load would be refused with -ENOEXEC"
      fi
      echo "--- module_layout CRC present? ---"
      if readelf -p __versions "$KO" 2>/dev/null | grep -q module_layout; then
        echo "  yes - classic __versions carries module_layout"
      else
        echo "  not in classic __versions (extended modversions path will be used)"
      fi
      echo "--- undefined symbols the loader must absolutize ---"
      nm -u "$KO" | wc -l

      # NOT $ARTIFACTS_FOLDER: "Create Kernel ZIP" runs
      #   find "$ARTIFACTS_FOLDER" -maxdepth 1 -type f ! -name "$ZIP_NAME" -delete
      # which sweeps anything that is not the AK3 zip, so a .ko staged there is gone
      # before the upload step sees it.  Use a directory of our own.
      SUSFS_OUT="$GITHUB_WORKSPACE/susfs-ko"
      mkdir -p "$SUSFS_OUT"
      cp "$KO" "$SUSFS_OUT/susfs_guard_lkm-${OP_MODEL}-${OP_ANDROID_VERSION}-${OP_KERNEL_VERSION}.ko"
      echo "SUSFS_KO_DIR=$SUSFS_OUT" >> "$GITHUB_ENV"
      echo "SUSFS_KO_NAME=susfs_guard_lkm-${OP_MODEL}-${OP_ANDROID_VERSION}-${OP_KERNEL_VERSION}.ko" >> "$GITHUB_ENV"

      # The module rides inside the AK3 zip of the kernel it was built against, so the
      # two cannot be separated or mispaired. anykernel.sh copies it out to storage on
      # flash (best-effort), and the autoloader adopts it from there - or straight out
      # of the zip when /data was not writable at flash time.
      cp "$KO" "$AK3_FOLDER/susfs_guard_lkm.ko"
      echo "bundled susfs_guard_lkm.ko into the AK3 zip"
      (cd "$SUSFS_OUT" && sha256sum ./* > sha256sums.txt)
      echo "SUSFS_KO_STATUS=ok ($KREL)" >> "$GITHUB_ENV"
      echo "--- shipped ---"; ls -l "$SUSFS_OUT" | sed 's/^/  /'
      echo "✅ built against this kernel and bundled into the AK3 zip"
      echo "::endgroup::"

  - name: Create Kernel ZIP
    id: create_zip
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Create kernel ZIP package"

      IMAGE_PATH="$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image"

      if [ -f "$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image" ]; then
        IMAGE_PATH="$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image"
      elif [ -f "$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image" ]; then
        IMAGE_PATH="$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image"
      fi

      if [ ! -f "$IMAGE_PATH" ]; then
        echo "::error::Built Image not found at: $IMAGE_PATH"
        exit 1
      fi

      cp "$IMAGE_PATH" "$AK3_FOLDER/Image"

      mv "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt" "$AK3_FOLDER/"
      cd "$AK3_FOLDER"

      sed -i 's/do.check_boot_version=.*/do.check_boot_version=1/' anykernel.sh


      ZIP_MODEL=$(echo "$OP_MODEL" | sed 's/-[0-9]\+\.[0-9]\+\.[0-9]\+$//')
      ZIP_NAME="AK3_${ZIP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}_${{ inputs.ksu_type }}_${KSUVER:-unknown}.zip"
      mkdir -p "$ARTIFACTS_FOLDER"

      echo "Creating flashable ZIP: $ZIP_NAME"

      if ! zip -r9 "$ZIP_NAME" ./* \
           -x "*.git*" \
           -x "$ZIP_NAME" \
           -x "README.md" 2>&1 | tee /tmp/zip.log; then
        echo "::error::Failed to create ZIP package"
        exit 1
      fi

      mv "$ZIP_NAME" "$ARTIFACTS_FOLDER/"

      find "$ARTIFACTS_FOLDER" -maxdepth 1 -type f ! -name "$ZIP_NAME" -delete

      ZIP_SIZE=$(stat -c%s "$ARTIFACTS_FOLDER/$ZIP_NAME")
      ZIP_SHA256=$(sha256sum "$ARTIFACTS_FOLDER/$ZIP_NAME" | awk '{print $1}')
      printf 'zip_sha256=%s\n' "$ZIP_SHA256" >> "$GITHUB_OUTPUT"

      echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
      echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      echo ""
      echo "✅ Kernel ZIP created successfully"
      echo "   Name: $ZIP_NAME"
      echo "   Size: $(numfmt --to=iec-i --suffix=B "$ZIP_SIZE")"
      echo "   SHA256: $ZIP_SHA256"
      echo "::endgroup::"

  - name: Final Build Summary
    shell: bash
    run: |
      set -euo pipefail

      KSU_SHA="${KSU_COMMIT_SHA:-unknown}"

      {
        echo "Model: ${{ env.OP_MODEL }}"
        echo "OS Version: ${{ env.OP_OS_VERSION }}"
        echo "Android: ${{ env.ANDROID_VER }}"
        echo "Kernel base: ${{ env.KERNEL_VER }}"
        echo "Kernel full: ${{ env.KERNEL_FULL_VER }}"
        echo "Kernel Uname: ${{ env.KERNEL_UNAME }}"
        echo "Build User: ${{ env.BUILD_USER }}"
        echo "Build Host: ${{ env.BUILD_HOST }}"
        echo "SukiSU Version: ${KSUVER:-unknown}"
        echo "SukiSU commit SHA: ${KSU_SHA:-unknown}"
        if [ "${{ env.OP_NMS }}" = true ]; then
          echo "NoMount Version: ${NMVER:-unknown}"
        fi
        echo "Optimization: ${{ inputs.optimize_level }}"
        echo "Clean Build: ${{ inputs.clean }}"
        echo ""
        echo "=== OnePlus Features ==="
        echo "Kernel Optimisations: ${{ env.OP_OPT }}"
        echo "BBR: ${{ env.OP_BBR }}"
        echo "BBRv3: ${{ env.OP_BBR3 }}"
        echo "BoRE: ${BORE_STATUS:-disabled} (via ${BORE_VIA:-n/a})"
        echo "LZ4 1.10.0 + ARM64 NEON: ${LZ4_UPGRADED:-false}"
        echo "BBG: ${{ env.OP_BBG }}"
        echo "HMBIRD SCX: ${{ env.OP_HMBIRD }}"
        echo "TTL: ${{ env.OP_TTL }}"
        echo "IP_SET & IPv6 NAT: ${{ env.OP_IP_SET }}"
        echo "Unicode Fix: ${{ env.OP_UNICODE }}"
        echo "NTSync: ${{ env.OP_NTSYNC }}"
        echo "Droidspaces: ${{ env.OP_DS }}"
        echo ""
        echo "Image SHA256: ${{ steps.collect_stats.outputs.image_sha256 }}"
        echo "AnyKernel3 ZIP SHA256: ${{ steps.create_zip.outputs.zip_sha256 }}"
        echo "Compiler: ${CLANG_VERSION:-unknown}"
        echo "Warnings Count: ${{ steps.collect_stats.outputs.warnings_count }}"
        echo "Build Time: ${{ steps.collect_stats.outputs.build_time }}s"
        if [ "${{ inputs.clean }}" == "false" ]; then
          echo "ccache Hit Rate: ${{ steps.ccache_stats.outputs.hit_rate }}"
          echo "ccache Direct Rate: ${{ steps.ccache_stats.outputs.direct_rate }}"
        else
          echo "ccache: Disabled (clean build)"
        fi
        echo "Artifact Name: ${{ env.ZIP_NAME }}"
      } | tee summary.txt

      SUM_HEAD="🎯 <b>${{ env.OP_MODEL }}</b> — ${{ steps.save_metadata.outputs.kernel_version }}"
      SUM_HEAD="${SUM_HEAD} · ⚡SukiSU ${KSUVER:-?}"
      if [ "${{ env.OP_NMS }}" = true ]; then SUM_HEAD="${SUM_HEAD} · NoMount ${NMVER:-?}"; fi
      SUM_HEAD="${SUM_HEAD} · ⏱ ${{ steps.collect_stats.outputs.build_time }}s"
      if [ "${{ steps.collect_stats.outputs.warnings_count }}" != "0" ]; then
        SUM_HEAD="${SUM_HEAD} · ⚠️ ${{ steps.collect_stats.outputs.warnings_count }}"
      fi

      {
        echo "<details>"
        echo "<summary>${SUM_HEAD}</summary>"
        echo ""
        echo "#### 🎯 Kernel Build Summary"
        echo ""
        echo "| Metric | Value |"
        echo "|--------|-------|"
        echo "| **Model** | ${{ env.OP_MODEL }} |"
        echo "| **OS Version** | ${{ env.OP_OS_VERSION }} |"
        echo "| **Kernel Version** | ${{ steps.save_metadata.outputs.kernel_version }} |"
        echo "| **Kernel Uname** | \`${{ env.KERNEL_UNAME }}\` |"
        echo "| **Build User** | ${{ env.BUILD_USER }} |"
        echo "| **Build Host** | ${{ env.BUILD_HOST }} |"
        echo "| **SukiSU Version** | ${KSUVER:-unknown} |"
        
        if [ "$KSU_SHA" != "unknown" ]; then
          echo "| **SukiSU Commit** | [\`${KSU_SHA:0:8}\`](https://github.com/SukiSU-Ultra/SukiSU-Ultra/commit/$KSU_SHA) |"
        else
          echo "| **SukiSU Commit** | unknown |"
        fi
        
        if [ "${{ env.OP_NMS }}" = true ]; then
          echo "| **NoMount Version** | ${NMVER:-unknown} |"
        fi
        
        echo ""
        echo "#### 🔧 OnePlus Features"
        echo ""
        echo "| Feature | Status |"
        echo "|---------|--------|"
        echo "| **Kernel Optimisations** | ${{ env.OP_OPT }} |"
        echo "| **BBR** | ${{ env.OP_BBR }} |"
        echo "| **BBRv3** | ${{ env.OP_BBR3 }} |"
        echo "| **BoRE** | ${BORE_STATUS:-disabled} (via ${BORE_VIA:-n/a}) |"
        echo "| **LZ4 1.10.0 + ARM64 NEON** | ${LZ4_UPGRADED:-false} |"
        echo "| **BBG** | ${{ env.OP_BBG }} |"
        echo "| **HMBIRD SCX** | ${{ env.OP_HMBIRD }} |"
        echo "| **TTL** | ${{ env.OP_TTL }} |"
        echo "| **IP_SET & IPv6 NAT** | ${{ env.OP_IP_SET }} |"
        echo "| **Unicode Fix** | ${{ env.OP_UNICODE }} |"
        echo "| **NTSync** | ${{ env.OP_NTSYNC }} |"
        echo "| **Droidspaces** | ${{ env.OP_DS }} |"
        
        echo ""
        echo "#### 📊 Build Metrics"
        echo ""
        echo "| Metric | Value |"
        echo "|--------|-------|"
        echo "| **Optimization** | ${{ inputs.optimize_level }} |"
        echo "| **Clean Build** | ${{ inputs.clean }} |"
        echo "| **Build Time** | ${{ steps.collect_stats.outputs.build_time }}s |"
        
        if [ "${{ inputs.clean }}" == "false" ]; then
          echo "| **ccache Hit Rate** | ${{ steps.ccache_stats.outputs.hit_rate }} |"
          echo "| **ccache Direct Rate** | ${{ steps.ccache_stats.outputs.direct_rate }} |"
        fi
        
        echo "| **Image SHA256** | \`${{ steps.collect_stats.outputs.image_sha256 }}\` |"
        echo "| **Warnings** | ${{ steps.collect_stats.outputs.warnings_count }} |"
        echo "| **Compiler** | \`${CLANG_VERSION:-unknown}\` |"
        echo "| **Artifact Name** | \`${{ env.ZIP_NAME }}\` |"
        echo "| **AnyKernel3 SHA256** | \`${{ steps.create_zip.outputs.zip_sha256 }}\` |"
        echo ""
        echo "</details>"
      } >> "$GITHUB_STEP_SUMMARY"

  - name: Upload Debug Artifacts
    if: ${{ always() && !cancelled() && inputs.debug == 'true' }}
    uses: actions/upload-artifact@v7
    with:
      name: ${{ env.DEBUG_ZIP_NAME }}
      path: ${{ env.DEBUG_ARTIFACTS_FOLDER }}
      compression-level: 9
      retention-days: 90

  - name: Upload Artifacts
    if: success() && steps.create_zip.conclusion == 'success'
    uses: actions/upload-artifact@v7
    with:
      name: ${{ env.ZIP_NAME }}
      path: ${{ env.ARTIFACTS_FOLDER }}/${{ env.ZIP_NAME }}
      archive: false
      compression-level: 0
      retention-days: 90

  # The step now exits 0 even when it bails, so its conclusion is always 'success' and
  # cannot gate this.  SUSFS_KO_NAME is written only on the success path, so its
  # presence is the real signal.
  - name: Upload susfs_guard_lkm.ko
    if: env.SUSFS_KO_NAME != ''
    uses: actions/upload-artifact@v7
    with:
      name: ${{ env.SUSFS_KO_NAME }}
      path: ${{ env.SUSFS_KO_DIR }}/${{ env.SUSFS_KO_NAME }}
      archive: false
      compression-level: 0
      retention-days: 90
      if-no-files-found: error

  - name: Upload ccache log
    if: success() && inputs.debug == 'true' && steps.build_kernel_step.conclusion == 'success'
    uses: actions/upload-artifact@v7
    with:
      name: "${{ env.OP_MODEL }}_${{ env.OP_OS_VERSION }}_${{ env.KERNEL_FULL_VER }}_ccache.log"
      path: ${{ env.CCACHE_LOGFILE }}
      archive: false
      compression-level: 0
      retention-days: 90

  - name: 📥 Checkout Code
    uses: actions/checkout@v6
    if: always() && steps.build_kernel_step.conclusion == 'success'
    with:
      path: main-source
      fetch-depth: 1

  - name: Normalize ccache before saving
    if: ${{ always() && steps.build_kernel_step.conclusion == 'success' }}
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Normalize ccache before saving"

      unset CCACHE_DEPEND              || true
      unset CCACHE_READONLY_DIRECT     || true
      unset CCACHE_COMPRESSION         || true
      unset CCACHE_COMPRESSION_LEVEL   || true
      unset CCACHE_FILE_CLONE          || true
      unset CCACHE_INODE_CACHE         || true

      {
        echo "CCACHE_COMPILERCHECK=content"
        echo "CCACHE_COMPRESS=true"
        echo "CCACHE_COMPRESSLEVEL=3"
        echo "CCACHE_DIRECT=true"
        echo "CCACHE_FILECLONE=true"
        echo "CCACHE_NOINODECACHE=true"
        echo "CCACHE_NOREADONLY_DIRECT=true"
        echo "CCACHE_NOHASHDIR=true"
        echo "CCACHE_IGNOREOPTIONS=--sysroot*"
      } >> "$GITHUB_ENV"

      if [ -d "${CCACHE_DIR:-}" ]; then
        echo "ccache directory: $CCACHE_DIR"
        echo "Size before cleanup:"
        du -sh "$CCACHE_DIR" || true

        ccache -c || true
        ccache --evict-older-than 10800s || true

        echo "Size after cleanup:"
        du -sh "$CCACHE_DIR" || true
      else
        echo "No ccache directory found."
      fi

      echo "::endgroup::"

  - name: Save ccache cache
    if: always() && steps.build_kernel_step.conclusion == 'success'
    uses: ./action-source/.github/actions/cache/save
    with:
      cache_path: ${{ env.CCACHE_DIR }}
      cache_key: ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}
      cache_bucket: "ccache-cache"
      debug: ${{ inputs.debug }}
      github_token: ${{ inputs.github_token }}
      working_dir: "./main-source"
      compression_level: 6

  - name: 🧹 Cleanup on failure
    if: ${{ failure() }}
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Cleanup on failure"

      echo "Build failed — cleaning up large temporary artifacts to free runner disk space"

      if [ -d "${COMMON_KERNEL_FOLDER:-}/out" ]; then
        echo "Removing build output: $COMMON_KERNEL_FOLDER/out"
        rm -rf "$COMMON_KERNEL_FOLDER/out" || true
      fi


      if [ -d "${KERNEL_PATCHES_FOLDER:-}" ]; then
        echo "Removing kernel patches: $KERNEL_PATCHES_FOLDER"
        rm -rf "$KERNEL_PATCHES_FOLDER" || true
      fi

      rm -f /tmp/sukisu_setup_*.sh /tmp/bbg_setup_*.sh /tmp/clone_log_* || true

      echo ""
      echo "Disk usage after cleanup:"
      df -h "$GITHUB_WORKSPACE" || true

      echo "::endgroup::"
