name: 'Build OnePlus Kernel with SukiSU'
description: 'Build an OnePlus kernel with SukiSU support and add optional hardening/features.'

inputs:
  op_config_json:
    description: 'JSON string containing full device config'
    required: true
    type: string
  ksu_type:
    description: 'Select KSU Type'
    required: true
    type: choice
    options:
    - SUKISU
  ksu_branch_or_hash:
    description: 'KSU branch or commit hash (empty = auto-detect by ksu_type)'
    required: false
    type: string
    default: ""
  build_timestamp:
    description: 'Custom kernel build timestamp shown in uname -a (e.g. "Fri Dec 5 02:05:55 UTC 2025"). Leave empty to use the current build time.'
    required: false
    type: string
    default: ''
  optimize_level:
    description: 'Compiler optimization level (O2 or O3)'
    required: false
    type: string
    default: O2
  clean:
    description: 'Force clean build without ccache acceleration'
    required: false
    type: boolean
    default: false
  debug:
    description: 'Enable dumping debug related artifacts'
    required: false
    type: boolean
    default: false
  enable_adios:
    description: 'Enable ADIOS I/O scheduler support (5.10/5.15/6.1/6.6/6.12 kernels)'
    required: false
    type: boolean
    default: false
  susfs_lkm_ref:
    description: 'Branch/ref of Bouteillepleine/susfs4ksu-lkm to build susfs_guard_lkm.ko from, against THIS kernel tree. Empty = do not build it. SUSFS is not in the kernel source; this is the loadable-module port, so it must be compiled against the same tree and toolchain as the Image or its struct offsets and kCFI type hashes will not match.'
    required: false
    type: string
    default: ''
  nomount_ref:
    description: 'NoMount-Suite branch/ref to source the Prism engine src + patches from (default main; set a branch to validate it before it is released). The engine ships inside the Suite repo, under hookless/.'
    required: false
    type: string
    default: main
  patches_ref:
    description: 'kernel_patches branch/ref to source the _ghost/_hook/_pathhide cloaks and the apply script from (default main; set a test branch to validate before merge)'
    required: false
    type: string
    default: main
  patch_dry_run:
    description: 'Apply all patches and stop before compilation (verification mode)'
    required: false
    type: boolean
    default: false
  github_token:
    description: 'GitHub Token'
    required: true

outputs:
  kernel_version:
    description: 'Full kernel version string'
    value: ${{ steps.save_metadata.outputs.kernel_version }}
  ksu_version:
    description: 'SukiSU version number'
    value: ${{ steps.save_metadata.outputs.ksu_version }}
  ksu_type:
    description: 'SukiSU Variant'
    value: ${{ steps.save_metadata.outputs.ksu_type }}
  build_timestamp:
    description: 'Effective kernel build timestamp used in uname -a'
    value: ${{ steps.save_metadata.outputs.build_timestamp }}
  image_sha256:
    description: 'SHA256 hash of kernel Image'
    value: ${{ steps.collect_stats.outputs.image_sha256 }}
  zip_sha256:
    description: 'SHA256 hash of AnyKernel3 Zip'
    value: ${{ steps.create_zip.outputs.zip_sha256 }}
  warnings:
    description: 'Number of compiler warnings'
    value: ${{ steps.collect_stats.outputs.warnings_count }}
  build_time:
    description: 'Total build time in seconds'
    value: ${{ steps.collect_stats.outputs.build_time }}
  ccache_hit_rate:
    description: 'ccache hit rate percentage'
    value: ${{ steps.ccache_stats.outputs.hit_rate }}
  ccache_direct_rate:
    description: 'ccache direct hit rate percentage'
    value: ${{ steps.ccache_stats.outputs.direct_rate }}
  zip_name:
    description: 'Name of the generated flashable ZIP'
    value: ${{ steps.create_zip.outputs.zip_name }}

runs:
  using: 'composite'
  steps:
  - name: Get Action info
    shell: bash
    env:
      ACTION_REPO_VAL: ${{ github.action_repository }}
      ACTION_REF_VAL: ${{ github.action_ref }}
    run: |
      set -euo pipefail
      echo "ACTION_REPO=$ACTION_REPO_VAL" >> $GITHUB_ENV
      echo "ACTION_REF=$ACTION_REF_VAL" >> $GITHUB_ENV

  - name: 📥 Checkout Code
    uses: actions/checkout@v6
    with:
      repository: ${{ env.ACTION_REPO }}
      ref: ${{ env.ACTION_REF }}
      path: action-source
      fetch-depth: 1

  - name: Parse op_config_json
    shell: bash
    run: |
      set -euo pipefail
      echo '${{ inputs.op_config_json }}' > /tmp/config.json
      jq -r 'to_entries[] | "OP_\(.key | ascii_upcase)=\(.value)"' /tmp/config.json >> "$GITHUB_ENV"
      P_MODEL="$(jq -r '.model // "unknown"' /tmp/config.json)"
      P_OSVER="$(jq -r '.os_version // "unknown"' /tmp/config.json)"
      PS_BASE="$(echo "$P_MODEL" | sed 's/-[0-9]\+\.[0-9]\+\.[0-9]\+$//')_${P_OSVER}"
      echo "PS_BASE=$PS_BASE" >> "$GITHUB_ENV"
      echo "PS_FILE=$GITHUB_WORKSPACE/patch-status-$PS_BASE.txt" >> "$GITHUB_ENV"
      if [ -z "${OP_BORE:-}" ]; then
        echo "OP_BORE=true" >> "$GITHUB_ENV"
      fi
      echo "Parsed config:"
      jq '.' /tmp/config.json

  - name: Validate KSU Type
    shell: bash
    run: |
      set -euo pipefail

      if [ "${{ inputs.ksu_type }}" != "SUKISU" ]; then
        echo "::error::This action only supports SUKISU/SukiSU. Got: ${{ inputs.ksu_type }}"
        exit 1
      fi

      echo "✅ KSU type validated: ${{ inputs.ksu_type }}"

  - name: Validate Inputs
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Validate inputs"
      model="$OP_MODEL"
      soc="$OP_SOC"
      branch="$OP_BRANCH"
      manifest="$OP_MANIFEST"
      android_version="$OP_ANDROID_VERSION"
      kernel_version="$OP_KERNEL_VERSION"
      os_version="$OP_OS_VERSION"
      hmbird="$OP_HMBIRD"
      nms="$OP_NMS"
      opt="$OP_OPT"
      bbg="$OP_BBG"
      bbr="$OP_BBR"
      bbr3="$OP_BBR3"
      ttl="$OP_TTL"
      ip_set="$OP_IP_SET"
      rust_build="$OP_RUST_BUILD"
      lto="$OP_LTO"
      uname="$OP_UNAME"
      unicode="$OP_UNICODE"
      c_compiler="$OP_C_COMPILER"
      rust_compiler="$OP_RUST_COMPILER"
      zyc_compiler="$OP_ZYC_COMPILER"
      bindgen="$OP_BINDGEN"
      ds="$OP_DS"
      ntsync="$OP_NTSYNC"
      blacklist_modules="$OP_BLACKLIST_MODULES"
      optimize='${{ inputs.optimize_level }}'

      errors=()

      if [[ -z "$model" ]]; then
        errors+=("Input 'model' cannot be empty")
      elif [[ ! "$model" =~ ^OP ]]; then
        errors+=("Input 'model' does not start with 'OP'. Got: '$model'")
      fi

      if [[ -z "$soc" ]]; then
        errors+=("Input 'soc' cannot be empty")
      elif [[ ! "$soc" =~ ^[A-Za-z0-9_-]+$ ]]; then
        errors+=("Input 'soc' contains invalid characters. Allowed: letters, digits, underscore, dash. Got: '$soc'")
      fi

      if [[ -z "$branch" ]]; then
        errors+=("Input 'branch' cannot be empty")
      elif [[ ! "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
        errors+=("Input 'branch' contains invalid characters. Allowed: letters, digits, ., _, -, /. Got: '$branch'")
      fi

      if [[ -z "$manifest" ]]; then
        errors+=("Input 'manifest' cannot be empty")
      elif [[ "$manifest" == http*://* ]]; then
        if [[ ! "$manifest" =~ ^https:// ]]; then
          errors+=("Manifest URL must be HTTPS. Got: '$manifest'")
        fi
        if [[ ! "$manifest" =~ \.xml($|\?) ]]; then
          errors+=("Manifest URL should point to an XML file (.xml). Got: '$manifest'")
        fi
      else
        if [[ ! "$manifest" =~ \.xml$ ]]; then
          errors+=("Manifest filename must end with .xml. Got: '$manifest'")
        fi
        if [[ "$manifest" =~ [[:space:]] ]]; then
          errors+=("Manifest filename cannot contain spaces. Got: '$manifest'")
        fi
      fi

      if [[ -z "$android_version" ]]; then
        errors+=("Input 'android_version' cannot be empty")
      elif [[ ! "$android_version" =~ ^android[0-9]+$ ]]; then
        errors+=("Input 'android_version' contains invalid characters. Allowed: android followed by a number. Got: '$android_version'")
      fi

      if [[ -z "$kernel_version" ]]; then
        errors+=("Input 'kernel_version' cannot be empty")
      elif [[ ! "$kernel_version" =~ ^[0-9]+\.[0-9]+$ ]]; then
        errors+=("Input 'kernel_version' contains invalid characters. Allowed: number in X.Y format. Got: '$kernel_version'")
      fi

      if [[ -z "$os_version" ]]; then
        errors+=("Input 'os_version' cannot be empty")
      elif [[ ! "$os_version" =~ ^A ]]; then
        errors+=("Input 'os_version' does not start with 'A'. Got: '$os_version'")
      fi

      if [[ -z "$hmbird" ]]; then
        errors+=("Input 'hmbird' cannot be empty")
      elif [[ "$hmbird" != "true" && "$hmbird" != "false" ]]; then
        errors+=("Input 'hmbird' contains invalid characters. Allowed: 'true' or 'false'. Got: '$hmbird'")
      fi

      if [[ -z "$nms" ]]; then
        errors+=("Input 'NMS' cannot be empty")
      elif [[ "$nms" != "true" && "$nms" != "false" ]]; then
        errors+=("Input 'NMS' contains invalid characters. Allowed: 'true' or 'false'. Got: '$nms'")
      fi

      if [[ -z "$opt" ]]; then
        errors+=("Input 'opt' cannot be empty")
      elif [[ "$opt" != "true" && "$opt" != "false" ]]; then
        errors+=("Input 'opt' contains invalid characters. Allowed: 'true' or 'false'. Got: '$opt'")
      fi

      if [[ -z "$bbg" ]]; then
        errors+=("Input 'bbg' cannot be empty")
      elif [[ "$bbg" != "true" && "$bbg" != "false" ]]; then
        errors+=("Input 'bbg' contains invalid characters. Allowed: 'true' or 'false'. Got: '$bbg'")
      fi

      if [[ -z "$bbr" ]]; then
        errors+=("Input 'bbr' cannot be empty")
      elif [[ "$bbr" != "true" && "$bbr" != "false" ]]; then
        errors+=("Input 'bbr' contains invalid characters. Allowed: 'true' or 'false'. Got: '$bbr'")
      fi

      if [[ -z "$bbr3" ]]; then
        errors+=("Input 'bbr3' cannot be empty")
      elif [[ "$bbr3" != "true" && "$bbr3" != "false" ]]; then
        errors+=("Input 'bbr3' contains invalid characters. Allowed: 'true' or 'false'. Got: '$bbr3'")
      fi

      for bool_opt in OP_BORE OP_LZ4_UPGRADE; do
        val="${!bool_opt:-}"
        if [[ -n "$val" && "$val" != "true" && "$val" != "false" ]]; then
          errors+=("$bool_opt must be true or false if set. Got: '$val'")
        fi
      done

      if [[ -z "$ttl" ]]; then
        errors+=("Input 'ttl' cannot be empty")
      elif [[ "$ttl" != "true" && "$ttl" != "false" ]]; then
        errors+=("Input 'ttl' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ttl'")
      fi

      if [[ -z "$ip_set" ]]; then
        errors+=("Input 'ip_set' cannot be empty")
      elif [[ "$ip_set" != "true" && "$ip_set" != "false" ]]; then
        errors+=("Input 'ip_set' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ip_set'")
      fi

      if [[ -z "$rust_build" ]]; then
        errors+=("Input 'rust_build' cannot be empty")
      elif [[ "$rust_build" != "true" && "$rust_build" != "false" ]]; then
        errors+=("Input 'rust_build' contains invalid characters. Allowed: 'true' or 'false'. Got: '$rust_build'")
      fi

      if [[ -z "$lto" ]]; then
        errors+=("Input 'lto' cannot be empty")
      elif [[ "$lto" != "none" && "$lto" != "thin" && "$lto" != "full" ]]; then
        errors+=("Input 'lto' contains invalid characters. Allowed: 'thin', 'full' or 'none'. Got: '$lto'")
      fi

      if [[ -z "$uname" ]]; then
        errors+=("Input 'uname' cannot be empty")
      elif [[ ${#uname} -gt 44 ]]; then
        errors+=("Input 'uname' too long. Maximum length: 44. Got: '$uname'")
      fi

      if [[ -z "$unicode" ]]; then
        errors+=("Input 'unicode' cannot be empty")
      elif [[ "$unicode" != "true" && "$unicode" != "false" ]]; then
        errors+=("Input 'unicode' contains invalid characters. Allowed: 'true' or 'false'. Got: '$unicode'")
      fi






      if [[ -z "$ds" ]]; then
        errors+=("Input 'ds' cannot be empty")
      elif [[ "$ds" != "true" && "$ds" != "false" ]]; then
        errors+=("Input 'ds' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ds'")
      fi

      if [[ -z "$ntsync" ]]; then
        errors+=("Input 'ntsync' cannot be empty")
      elif [[ "$ntsync" != "true" && "$ntsync" != "false" ]]; then
        errors+=("Input 'ntsync' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ntsync'")
      fi

      case "$optimize" in
        O2|O3) ;;
        *) errors+=("optimize_level must be O2 or O3. Got: '$optimize'"); ;;
      esac

      if [ ${#errors[@]} -ne 0 ]; then
        echo "Found ${#errors[@]} validation error(s):" >&2
        for error in "${errors[@]}"; do
          echo "  - $error" >&2
        done
        echo "::error::Input validation failed. See logs for details."
        exit 1
      else
        echo "✅ Input validation passed"
      fi
      echo "::endgroup::"

  - name: Setup Base Environment
    shell: bash
    run: |
      set -euo pipefail
      CONFIG="$OP_MODEL"
      echo "Creating folder for configuration: $CONFIG"
      mkdir -p "$CONFIG"
      echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"
      REPO="/usr/local/bin/repo"
      if [ ! -x "$REPO" ]; then
        curl -s https://storage.googleapis.com/git-repo-downloads/repo -o "$REPO"
        chmod +x "$REPO"
      fi
      echo "REPO=$REPO" >> "$GITHUB_ENV"

  - name: Optimize Global Git for Repo Tool
    shell: bash
    run: |
      set -euo pipefail
      git config --global feature.manyFiles true
      git config --global core.fsmonitor true
      git config --global pack.sparse true

  - name: Sync Kernel Source
    id: sync-kernel-source
    uses: ./action-source/.github/actions/kernel-source-sync
    with:
      source_location: ${{ env.CONFIG }}
      github_token: ${{ inputs.github_token }}
      debug: ${{ inputs.debug }}

  - name: Set Dir Paths
    shell: bash
    run: |
      set -euo pipefail
      CONFIG_DIR="$GITHUB_WORKSPACE/$CONFIG"
      ARTIFACTS_DIR="$CONFIG_DIR/artifacts"
      KERNEL_PLATFORM_DIR="$CONFIG_DIR/kernel_platform"
      COMMON_KERNEL_DIR="$KERNEL_PLATFORM_DIR/common"
      MSM_KERNEL_DIR="$KERNEL_PLATFORM_DIR/msm-kernel"
      AK3_DIR="$CONFIG_DIR/AnyKernel3"
      DEBUG_ARTIFACTS_DIR="$GITHUB_WORKSPACE/debug_artifacts"
      KERNEL_PATCHES_DIR="$GITHUB_WORKSPACE/kernel_patches"
      KSU_DIR="$KERNEL_PLATFORM_DIR/KernelSU"
      mkdir -p "$ARTIFACTS_DIR"
      mkdir -p "$DEBUG_ARTIFACTS_DIR"

      echo "CONFIG_FOLDER=$CONFIG_DIR" >> "$GITHUB_ENV"
      echo "ARTIFACTS_FOLDER=$ARTIFACTS_DIR" >> "$GITHUB_ENV"
      echo "KERNEL_PLATFORM_FOLDER=$KERNEL_PLATFORM_DIR" >> "$GITHUB_ENV"
      echo "COMMON_KERNEL_FOLDER=$COMMON_KERNEL_DIR" >> "$GITHUB_ENV"
      echo "MSM_KERNEL_FOLDER=$MSM_KERNEL_DIR" >> "$GITHUB_ENV"
      echo "AK3_FOLDER=$AK3_DIR" >> "$GITHUB_ENV"
      echo "DEBUG_ARTIFACTS_FOLDER=$DEBUG_ARTIFACTS_DIR" >> "$GITHUB_ENV"
      echo "KERNEL_PATCHES_FOLDER=$KERNEL_PATCHES_DIR" >> "$GITHUB_ENV"
      echo "KSU_FOLDER=$KSU_DIR" >> "$GITHUB_ENV"

      DEBUG_ZIP_NAME="debug_${OP_MODEL}_${OP_OS_VERSION}.zip"
      echo "DEBUG_ZIP_NAME=$DEBUG_ZIP_NAME" >> "$GITHUB_ENV"

  - name: Prepare patch generation harness
    shell: bash
    run: |
      set -euo pipefail
      mkdir -p "$GITHUB_WORKSPACE/patchgen" "$GITHUB_WORKSPACE/patch-faillogs"
      cat > "$GITHUB_WORKSPACE/patchgen/gen_patch.sh" <<'GEN_PATCH_EOF'
      split_hunks() {
        local patch_file="$1" out_dir="$2"
        rm -rf "$out_dir" && mkdir -p "$out_dir"
        awk -v out="$out_dir" '
          BEGIN { inh = 0; nh = 0; orem = 0; nrem = 0; sawd = 0; sawp = 0; hdr = "" }
          !inh && /^diff |^Index: / { hdr = $0 "\n"; sawd = 0; sawp = 0; next }
          !inh && /^--- / && !sawd { hdr = hdr $0 "\n"; sawd = 1; next }
          !inh && /^\+\+\+ / && sawd && !sawp { hdr = hdr $0 "\n"; sawp = 1; next }
          !inh && /^--- / && sawd && sawp { hdr = $0 "\n"; sawd = 1; sawp = 0; next }
          !inh && /^@@ / {
            split($0, a, " ")
            split(a[2], o, ","); split(a[3], n, ",")
            orem = (length(o[2]) ? o[2]+0 : 1); nrem = (length(n[2]) ? n[2]+0 : 1)
            if (sawp) {
              nh++; hf = sprintf("%s/h%03d.hunk", out, nh)
              printf "%s", hdr > hf; print $0 >> hf; inh = 1
            }
            next
          }
          inh {
            print $0 >> hf
            if ($0 ~ /^\\/) next
            c = substr($0, 1, 1)
            if (c == "-") orem--
            else if (c == "+") nrem--
            else { orem--; nrem-- }
            if (orem <= 0 && nrem <= 0) { close(hf); inh = 0 }
            next
          }
        ' "$patch_file"
      }
      anchor_rescue() {
        local name="$1" patch_file="$2" verify_spec="${3:-}"
        local anchors="$GITHUB_WORKSPACE/patch-anchors.txt"
        local sha
        sha=$(awk -v n="$name" '$1 == n && $2 ~ /^[0-9a-fA-F]{7,40}$/ { print $2; exit }' "$anchors" 2>/dev/null || true)
        if [ -z "$sha" ]; then
          echo "[patchgen] ${name}: no patch-anchors.txt entry; skipping 3-way rescue"
          return 1
        fi
        local kdir="$COMMON_KERNEL_FOLDER" adir="/tmp/pg_${name}_anchor" bdir="/tmp/pg_${name}_base" mdir="/tmp/pg_${name}_merged"
        local alog="/tmp/pg_${name}_anchor.log"
        rm -rf "$adir" "$bdir" "$mdir" && mkdir -p "$adir" "$bdir" "$mdir"
        echo "[patchgen] ${name}: staging failed — attempting anchor 3-way merge (base ${sha})"
        : > "$alog"
        git -C "$kdir" fetch --depth=1 origin "$sha" >> "$alog" 2>&1 || true
        if ! git -C "$kdir" cat-file -e "$sha" 2>/dev/null; then
          echo "::warning::[patchgen] ${name}: anchor ${sha} not fetchable from origin; rescue aborted"
          return 1
        fi
        if ! git -C "$kdir" archive "$sha" | tar -x -C "$bdir" >> "$alog" 2>&1; then
          echo "::warning::[patchgen] ${name}: anchor ${sha} archive failed; rescue aborted"
          return 1
        fi
        cp -a "$bdir/." "$adir/"
        if ! patch -p1 --dry-run --fuzz=0 --no-backup-if-mismatch -d "$adir" < "$patch_file" >> "$alog" 2>&1; then
          echo "::warning::[patchgen] ${name}: patch does not apply cleanly on anchor ${sha} (stale anchor); rescue aborted"
          cp "$alog" "$GITHUB_WORKSPACE/patch-faillogs/${name}_anchor.log" 2>/dev/null || true
          return 1
        fi
        local targets f rc status=0
        targets=$( { grep -E '^(\+\+\+|---) ' "$patch_file" || true; } | awk '{print $2}' | sed 's#^a/##;s#^b/##' | sort -u )
        patch -p1 --forward --fuzz=0 --no-backup-if-mismatch -d "$adir" < "$patch_file" >> "$alog" 2>&1 || true
        : > "${mdir}/.ops"
        for f in $targets; do
          case "$f" in /dev/null) continue ;; esac
          if [ -f "$bdir/$f" ] && [ -f "$adir/$f" ] && [ -f "$kdir/$f" ]; then
            mkdir -p "${mdir}/$(dirname "$f")"
            git merge-file -L ours -L base -L theirs -p "$kdir/$f" "$bdir/$f" "$adir/$f" > "${mdir}/$f" 2>>"$alog"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "conflict: $f (exit $rc)" >> "$alog"; status=1
            else
              echo "keep $f" >> "${mdir}/.ops"
            fi
          elif [ ! -f "$bdir/$f" ] && [ -f "$adir/$f" ] && [ ! -f "$kdir/$f" ]; then
            mkdir -p "${mdir}/$(dirname "$f")"
            cp "$adir/$f" "${mdir}/$f"
            echo "keep $f" >> "${mdir}/.ops"
          elif [ ! -f "$bdir/$f" ] && [ -f "$adir/$f" ] && [ -f "$kdir/$f" ]; then
            mkdir -p "${mdir}/$(dirname "$f")"
            git merge-file -L ours -L base -L theirs -p "$kdir/$f" /dev/null "$adir/$f" > "${mdir}/$f" 2>>"$alog"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "conflict: $f (created on both sides, exit $rc)" >> "$alog"; status=1
            else
              echo "keep $f" >> "${mdir}/.ops"
            fi
          elif [ -f "$bdir/$f" ] && [ ! -f "$adir/$f" ]; then
            if [ -f "$kdir/$f" ] && cmp -s "$kdir/$f" "$bdir/$f"; then
              echo "delete $f" >> "${mdir}/.ops"
            else
              echo "conflict: $f (deleted by patch but modified in tree)" >> "$alog"; status=1
            fi
          elif [ -f "$bdir/$f" ] && [ -f "$adir/$f" ] && [ ! -f "$kdir/$f" ]; then
            mkdir -p "${mdir}/$(dirname "$f")"
            git merge-file -L ours -L base -L theirs -p /dev/null "$bdir/$f" "$adir/$f" > "${mdir}/$f" 2>>"$alog"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "conflict: $f (missing in tree, exit $rc)" >> "$alog"; status=1
            else
              echo "keep $f" >> "${mdir}/.ops"
            fi
          else
            echo "conflict: $f (unresolvable file state)" >> "$alog"; status=1
          fi
        done
        if [ "$status" -ne 0 ]; then
          echo "::warning::[patchgen] ${name}: anchor 3-way merge hit conflicts; patch rejected (all-or-nothing)"
          cp "$alog" "$GITHUB_WORKSPACE/patch-faillogs/${name}_anchor.log" 2>/dev/null || true
          return 1
        fi
        if [ -n "$verify_spec" ]; then
          local spec vrc=0
          local -a vlist
          ( cd "$mdir" || exit 1
            IFS=';' read -ra vlist <<< "$verify_spec"
            for spec in "${vlist[@]}"; do
              [ -n "$spec" ] || continue
              case "$spec" in
                g:*) verify_grep "${spec#g:}" || { vrc=1; break; } ;;
                f:*) verify_infn "${spec#f:}" || { vrc=1; break; } ;;
              esac
            done ) || vrc=1
          if [ "$vrc" -ne 0 ]; then
            echo "::warning::[patchgen] ${name}: anchor-merged result failed verification; patch rejected"
            cp "$alog" "$GITHUB_WORKSPACE/patch-faillogs/${name}_anchor.log" 2>/dev/null || true
            return 1
          fi
          echo "[patchgen] ${name}: anchor-merge verification passed"
          echo "✅ ${name} verified (anchor-merge)"
        fi
        local op p
        while read -r op; do
          case "$op" in
            keep\ *) p="${op#keep }"; cp "${mdir}/${p}" "${kdir}/${p}" ;;
            delete\ *) p="${op#delete }"; rm -f "${kdir}/${p}" ;;
          esac
        done < "${mdir}/.ops"
        echo "[patchgen] ${name}: applied via anchor 3-way merge (base ${sha})"
        echo "${name}|applied" >> "${PS_FILE:-patch-status-raw.txt}"
        cp "$alog" "$GITHUB_WORKSPACE/patch-faillogs/${name}_anchor.log" 2>/dev/null || true
        return 0
      }
      fuzz_restage() {
        local name="$1" src="$2" md="$3" targets="$4" base="$5"
        local f h hdir hlist ok=1
        for f in $targets; do
          case "$f" in /dev/null) continue ;; esac
          [ -f "$f" ] || continue
          cp "$f" "${md}/$f"
        done
        : > "${base}/fuzz.log"
        hdir="${base}/hunks_fuzz"
        split_hunks "$src" "$hdir"
        hlist=$(ls "$hdir"/*.hunk 2>/dev/null || true)
        for h in $hlist; do
          if patch -p1 --forward --fuzz=0 --no-backup-if-mismatch -d "$md" < "$h" >> "${base}/fuzz.log" 2>&1; then
            continue
          fi
          if patch -p1 --forward --fuzz=2 --no-backup-if-mismatch -d "$md" < "$h" >> "${base}/fuzz.log" 2>&1; then
            echo "hunk ${h##*/} staged at fuzz=2 (sandbox only)" >> "${base}/fuzz.log"
            continue
          fi
          echo "hunk ${h##*/} not stageable even at fuzz=2" >> "${base}/fuzz.log"
          ok=0
        done
        find "$md" -name '*.rej' -delete 2>/dev/null || true
        find "$md" -name '*.orig' -delete 2>/dev/null || true
        if [ "$ok" -eq 1 ]; then
          cp "${base}/fuzz.log" "$GITHUB_WORKSPACE/patch-faillogs/${name}_fuzz.log" 2>/dev/null || true
          echo "[patchgen] ${name}: staged with bounded per-hunk fuzz (sandbox only); regenerating exact patch for the target tree"
          return 0
        fi
        cp "${base}/fuzz.log" "$GITHUB_WORKSPACE/patch-faillogs/${name}_fuzz.log" 2>/dev/null || true
        return 1
      }
      gen_patch() {
        local name="$1" patch_file="$2" sed_expr="${3:-}" verify_spec="${4:-}"
        local base="$GITHUB_WORKSPACE/patchgen/${name}"
        local um="${base}/unmodified" md="${base}/modified"
        local psf="${PS_FILE:-patch-status-raw.txt}"
        rm -rf "$base" && mkdir -p "$um" "$md"
        local src="/tmp/pg_${name}.patch"
        if [ -n "$sed_expr" ]; then sed -e "$sed_expr" "$patch_file" > "$src"; else cp "$patch_file" "$src"; fi
        local targets f
        targets=$( { grep -E '^\+\+\+ ' "$src" || true; } | awk '{print $2}' | sed 's#^a/##;s#^b/##' | sort -u )
        if [ -z "$targets" ]; then
          echo "::warning::[patchgen] ${name} patch exposes no file targets; not applied"
          echo "${name}|failed" >> "$psf"
          return 0
        fi
        for f in $targets; do
          case "$f" in /dev/null) continue ;; esac
          [ -f "$f" ] || continue
          mkdir -p "${um}/$(dirname "$f")" "${md}/$(dirname "$f")"
          cp "$f" "${um}/$f" && cp "$f" "${md}/$f"
        done
        local hunk_dir="${base}/hunks" h hlist staged already_ct failed_ct
        mkdir -p "$hunk_dir"
        split_hunks "$src" "$hunk_dir"
        hlist=$(ls "$hunk_dir"/*.hunk 2>/dev/null || true)
        : > "${base}/stage.log"
        if [ -z "$hlist" ]; then
          if patch -p1 --forward --fuzz=0 --no-backup-if-mismatch -d "$md" < "$src" >> "${base}/stage.log" 2>&1; then
            staged=1; already_ct=0; failed_ct=0
          elif patch -p1 --dry-run -R --fuzz=0 -d "$md" < "$src" >/dev/null 2>&1; then
            echo "[patchgen] ${name}: change already present in tree (reverse dry-run clean at staging)"
            verify_applied "$name" "$src" \
              || echo "::warning::[patchgen] ${name}: already-present evidence check inconclusive"
            echo "[patchgen] ${name}: verification passed"
            echo "✅ ${name} verified (already in tree)"
            echo "${name}|already" >> "$psf"
            return 0
          else
            anchor_rescue "$name" "$src" "$verify_spec" && return 0
            if fuzz_restage "$name" "$src" "$md" "$targets" "$base"; then
              staged=1; already_ct=0; failed_ct=0
            else
              cp "${base}/stage.log" "$GITHUB_WORKSPACE/patch-faillogs/${name}_stage.log" 2>/dev/null || true
              find "$md" -name '*.rej' -exec sh -c 'cp "$1" "$2/$(basename "${1%.rej}")_$(basename "$1")"' _ {} "$GITHUB_WORKSPACE/patch-faillogs" \; 2>/dev/null || true
              echo "::warning::[patchgen] ${name} failed to stage in sandbox; not applied"
              echo "${name}|failed" >> "$psf"
              return 0
            fi
          fi
        else
          staged=0; already_ct=0; failed_ct=0
          for h in $hlist; do
            if patch -p1 --forward --fuzz=0 --no-backup-if-mismatch -d "$md" < "$h" >> "${base}/stage.log" 2>&1; then
              staged=$((staged+1))
            elif patch -p1 --dry-run -R --fuzz=0 -d "$md" < "$h" >> "${base}/stage.log" 2>&1; then
              already_ct=$((already_ct+1))
            else
              failed_ct=$((failed_ct+1))
              echo "hunk not stageable: ${h##*/}" >> "${base}/stage.log"
            fi
          done
          find "$md" -name '*.rej' -delete 2>/dev/null || true
          find "$md" -name '*.orig' -delete 2>/dev/null || true
          echo "[patchgen] ${name}: staged=${staged} already=${already_ct} failed=${failed_ct}"
          [ "$failed_ct" -eq 0 ] || cp "${base}/stage.log" "$GITHUB_WORKSPACE/patch-faillogs/${name}_stage.log" 2>/dev/null || true
          if [ "$failed_ct" -gt 0 ]; then
            anchor_rescue "$name" "$src" "$verify_spec" && return 0
            if fuzz_restage "$name" "$src" "$md" "$targets" "$base"; then
              staged=1; already_ct=0; failed_ct=0
            else
              echo "::warning::[patchgen] ${name}: ${failed_ct} of $((staged + already_ct + failed_ct)) hunk(s) not stageable at fuzz=0; fuzz re-stage failed; NOT applying a partial patch"
              echo "${name}|failed" >> "$psf"
              return 0
            fi
          fi
        fi
        if [ "$staged" -eq 0 ]; then
          if [ "$already_ct" -gt 0 ]; then
            [ "$failed_ct" -eq 0 ] || echo "::warning::[patchgen] ${name}: ${failed_ct} hunk(s) neither present nor applicable; ${already_ct} hunk(s) already in tree"
            echo "[patchgen] ${name}: change already present in tree"
            verify_applied "$name" "$src" \
              || echo "::warning::[patchgen] ${name}: already-present evidence check inconclusive"
            echo "[patchgen] ${name}: verification passed"
            echo "✅ ${name} verified (already in tree)"
            echo "${name}|already" >> "$psf"
          else
            anchor_rescue "$name" "$src" "$verify_spec" && return 0
            echo "::warning::[patchgen] ${name} failed to stage in sandbox; not applied"
            echo "${name}|failed" >> "$psf"
          fi
          return 0
        fi
        ( cd "$base" && diff -ruN unmodified modified ) > "${base}/regen.patch" || true
        if patch -p1 --forward --fuzz=0 < "${base}/regen.patch" > "${base}/apply.log" 2>&1; then
          :
        elif patch -p1 --dry-run -R --fuzz=0 < "${base}/regen.patch" >> "${base}/apply.log" 2>&1; then
          echo "[patchgen] ${name}: change already present in tree (reverse dry-run clean)"
          verify_applied "$name" "$src" \
            || echo "::warning::[patchgen] ${name}: already-present evidence check inconclusive"
          echo "[patchgen] ${name}: verification passed"
          echo "✅ ${name} verified (already in tree)"
          echo "${name}|already" >> "$psf"
          return 0
        else
          cp "${base}/apply.log" "$GITHUB_WORKSPACE/patch-faillogs/${name}_apply.log" 2>/dev/null || true
          echo "::warning::[patchgen] ${name} regenerated patch did not apply; not applied"
          echo "${name}|failed" >> "$psf"
          return 0
        fi
        if ! verify_applied "$name" "$src"; then
          {
            echo "[patchgen] ${name} self-verification FAILED (sampled added lines missing after apply)."
            echo "  Reverse-applying the patch to keep the tree consistent."
          } > "${base}/verify.log"
          patch -p1 -R --fuzz=0 < "${base}/regen.patch" >> "${base}/verify.log" 2>&1 || true
          cp "${base}/verify.log" "$GITHUB_WORKSPACE/patch-faillogs/${name}_verify.log" 2>/dev/null || true
          echo "::warning::[patchgen] ${name} applied but self-verification failed; patch reverted"
          echo "${name}|failed" >> "$psf"
          return 0
        fi
        if [ -n "$verify_spec" ]; then
          local spec rc=0
          local -a vlist
          IFS=';' read -ra vlist <<< "$verify_spec"
          for spec in "${vlist[@]}"; do
            [ -n "$spec" ] || continue
            case "$spec" in
              g:*) verify_grep "${spec#g:}" || { rc=1; break; } ;;
              f:*) verify_infn "${spec#f:}" || { rc=1; break; } ;;
              *) echo "::warning::[patchgen] ${name}: unknown verify directive '${spec}'" ;;
            esac
          done
          if [ "$rc" -ne 0 ]; then
            {
              echo "[patchgen] ${name} verification FAILED (spec: ${verify_spec})"
              echo "  A required symbol is missing or landed outside its expected scope."
              echo "  Reverse-applying the patch to keep the tree consistent."
            } > "${base}/verify.log"
            patch -p1 -R --fuzz=0 < "${base}/regen.patch" >> "${base}/verify.log" 2>&1 || true
            cp "${base}/verify.log" "$GITHUB_WORKSPACE/patch-faillogs/${name}_verify.log" 2>/dev/null || true
            echo "::warning::[patchgen] ${name} applied but verification failed; patch reverted"
            echo "${name}|failed" >> "$psf"
            return 0
          fi
          echo "[patchgen] ${name}: verification passed (spec: ${verify_spec})"
        else
          echo "[patchgen] ${name}: verification passed"
        fi
        echo "✅ ${name} verified"
        echo "${name}|applied" >> "$psf"
        return 0
      }
      gen_patch_fb() {
        # Primary-with-fallback wrapper around gen_patch. Runs the primary
        # patch first; if it does not land, wipes the stale per-patch status
        # lines and retries once with the fallback patch.
        # Sets GEN_PATCH_FB_VIA for the caller: primary | fallback | none.
        local name="$1" primary="$2" fallback="$3" sed_expr="${4:-}" verify_spec="${5:-}"
        local psf="${PS_FILE:-patch-status-raw.txt}"
        GEN_PATCH_FB_VIA="none"
        if [ -n "$primary" ] && [ -f "$primary" ]; then
          GEN_PATCH_FB_VIA="primary"
          sed -i "/^${name}|/d" "$psf" 2>/dev/null || true
          gen_patch "$name" "$primary" "$sed_expr" "$verify_spec" || true
          grep -Eq "^${name}\|(applied|already)" "$psf" 2>/dev/null && return 0
        fi
        if [ -n "$fallback" ] && [ -f "$fallback" ]; then
          GEN_PATCH_FB_VIA="fallback"
          echo "[patchgen] ${name}: primary patch did not land; falling back to $(basename "$fallback")"
          sed -i "/^${name}|/d" "$psf" 2>/dev/null || true
          gen_patch "$name" "$fallback" "$sed_expr" "$verify_spec" || true
          grep -Eq "^${name}\|(applied|already)" "$psf" 2>/dev/null && return 0
        fi
        return 1
      }
      verify_grep() {
        local spec="$1"
        local file="${spec%%|*}" regex="${spec#*|}"
        if [ ! -e "$file" ]; then
          echo "[patchgen] verify: ${file} not found"
          return 1
        fi
        local hits
        hits=$(grep -nE "$regex" "$file" 2>/dev/null | head -n 5 || true)
        if [ -n "$hits" ]; then
          printf '%s\n' "$hits"
          return 0
        fi
        echo "[patchgen] verify: no match for '${regex}' in ${file}"
        return 1
      }
      verify_infn() {
        local spec="$1"
        local file="${spec%%|*}"
        local rest="${spec#*|}"
        local func="${rest%%|*}" sym="${rest#*|}"
        [ -f "$file" ] || { echo "[patchgen] verify: ${file} not found"; return 1; }
        if awk -v fn="$func" -v sym="$sym" '
          $0 ~ ("^[A-Za-z_].*" fn "[[:space:]]*\\(") && $0 !~ /;[[:space:]]*$/ { infn = 1; depth = 0; seen = 0 }
          infn {
            ob = gsub(/{/, "{"); cb = gsub(/}/, "}")
            depth += ob - cb
            if ($0 ~ sym) { found = 1; exit }
            if (ob > 0) seen = 1
            if (seen && depth <= 0) { infn = 0; seen = 0 }
          }
          END { exit (found ? 0 : 1) }
        ' "$file"; then
          echo "[patchgen] verify: ${file}: '${sym}' present inside ${func}()"
          return 0
        fi
        echo "[patchgen] verify: ${file}: '${sym}' NOT found inside ${func}()"
        return 1
      }
      verify_applied() {
        # Generic post-apply self-verification driven by the patch itself:
        # sample lines the patch adds and confirm they are present in the
        # live tree. Prints matched evidence lines; non-zero if any sampled
        # line is missing. Handles both '+++ b/path' (upstream) and
        # '+++ modified/path' (diff -ruN regen) header shapes.
        local name="$1" patch_file="$2"
        local map
        map=$(awk '
          /^--- / { next }
          /^\+\+\+ / {
            p = $2
            if (p == "/dev/null") { cur = ""; next }
            sub(/^[^\/]+\//, "", p)
            cur = p; next
          }
          /^@@/ { next }
          /^\+/ {
            if (cur == "") next
            line = substr($0, 2); sub(/\r$/, "", line)
            if (line ~ /^[ \t]*$/) next
            if (length(line) > 240) next
            if (seen[cur] >= 2) next
            if (total >= 24) next
            print cur "\t" line
            seen[cur]++; total++
          }
          BEGIN { total = 0 }
        ' "$patch_file") || true
        if [ -z "$map" ]; then
          echo "[patchgen] ${name}: nothing to self-verify (no added lines)"
          return 0
        fi
        local f line shown=0 miss=0
        while IFS=$'\t' read -r f line; do
          [ -n "$f" ] || continue
          if [ ! -f "$f" ] || ! grep -qF -- "$line" "$f" 2>/dev/null; then
            echo "[patchgen] ${name}: VERIFY MISS ${f}: ${line}"
            miss=$((miss+1))
            continue
          fi
          if [ "$shown" -lt 8 ]; then
            grep -nF -- "$line" "$f" 2>/dev/null | head -n 1
            shown=$((shown+1))
          fi
        done <<< "$map"
        [ "$miss" -eq 0 ] || return 1
        return 0
      }
      fetch_patch() {
        local url="$1" out="$2" min="${3:-200}"
        curl -sSL --fail -o "$out" "$url" || return 1
        local sz
        sz="$(stat -c%s "$out" 2>/dev/null || echo 0)"
        if [ "$sz" -lt "$min" ]; then
          echo "::warning::[fetch_patch] ${url} fetched only ${sz} bytes (floor ${min}); treating as unavailable"
          return 1
        fi
        return 0
      }
      GEN_PATCH_EOF
      echo "patch generation harness ready"

  - name: Set Kernel build-tools to Path
    shell: bash
    run: |
      set -euo pipefail
      echo "${KERNEL_PLATFORM_FOLDER}/prebuilts/kernel-build-tools/linux-x86/bin/" >> $GITHUB_PATH
      echo "${KERNEL_PLATFORM_FOLDER}/prebuilts/kernel-build-tools/linux_musl-x86/bin/" >> $GITHUB_PATH

  - name: Get Kernel Version Info
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Get kernel version"
      cd "$COMMON_KERNEL_FOLDER"

      CONFIG_FILES=("build.config.common" "build.config.constants")
      BRANCH_LINE=""
      for f in "${CONFIG_FILES[@]}"; do
        if [ -f "$f" ]; then
          l=$(grep '^[[:space:]]*BRANCH=' "$f" || true)
          if [ -n "$l" ]; then BRANCH_LINE="$l"; break; fi
        fi
      done

      if [ -z "$BRANCH_LINE" ]; then
        echo "::error::No BRANCH= found in config files"; exit 1
      fi

      BRANCH_VALUE="${BRANCH_LINE#*=}"
      ANDROID_VERSION="${BRANCH_VALUE%-*}"

      if [ -z "$ANDROID_VERSION" ]; then
        echo "::error::Could not parse android version from BRANCH=$BRANCH_VALUE"
        exit 1
      fi

      VERSION=$(grep '^VERSION *=' Makefile | awk '{print $3}')
      PATCHLEVEL=$(grep '^PATCHLEVEL *=' Makefile | awk '{print $3}')
      SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | awk '{print $3}')
      FULL_VERSION="$VERSION.$PATCHLEVEL.$SUBLEVEL"

      cd "$ARTIFACTS_FOLDER"
      echo "$ANDROID_VERSION-$FULL_VERSION" > "${OP_MODEL}_${OP_OS_VERSION}.txt"
      echo "$OP_OS_VERSION" >> "${OP_MODEL}_${OP_OS_VERSION}.txt"

      {
        echo "ANDROID_VER=$ANDROID_VERSION"
        echo "KERNEL_VER=$VERSION.$PATCHLEVEL"
        echo "TKERNEL_VER=$FULL_VERSION"
        echo "KERNEL_FULL_VER=$ANDROID_VERSION-$FULL_VERSION"
      } >> "$GITHUB_ENV"

      echo "✅ Detected: $ANDROID_VERSION-$FULL_VERSION"
      echo "::endgroup::"

  - name: 🏷️ Set Build Identity (Hardcoded)
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Set build user/host"
              
      BUILD_USER="kleaf"
      BUILD_HOST="build-host"

      echo "BUILD_USER=$BUILD_USER" >> "$GITHUB_ENV"
      echo "BUILD_HOST=$BUILD_HOST" >> "$GITHUB_ENV"

      echo ""
      echo "✅ Build identity configured:"
      echo "   User: $BUILD_USER"
      echo "   Host: $BUILD_HOST"
      echo "::endgroup::"

  - name: Check or Detect Clang
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Detect Clang"
      CLANG_FOUND=false
      CLANG_BIN=""

      if [ -n "$OP_ZYC_COMPILER" ]; then
        echo "OP_ZYC_COMPILER detected as download link: $OP_ZYC_COMPILER"
        
        ZYC_DIR="$CONFIG_FOLDER/compiler/zyc"
        TEMP_TAR="$CONFIG_FOLDER/compiler.tar.gz"
        mkdir -p "$ZYC_DIR"
        
        echo "Downloading ZyC Clang from link..."
        
        max_retries=5
        attempt=1
        download_success=false
        
        while [ $attempt -le $max_retries ]; do
          echo "Download attempt $attempt/$max_retries..."
          
          if curl -L --fail --retry 3 --retry-delay 5 --connect-timeout 60 -o "$TEMP_TAR" "$OP_ZYC_COMPILER"; then
              echo "Download successful."
              download_success=true
              break
          else
              echo "Download failed (attempt $attempt)."
              rm -f "$TEMP_TAR" 2>/dev/null
              if [ $attempt -eq $max_retries ]; then
                  echo "Error: Failed to download ZyC Clang after $max_retries attempts."
                  break
              fi
              attempt=$((attempt + 1))
              sleep 8
          fi
        done

        if [ "$download_success" = true ]; then
          echo "Extracting to $ZYC_DIR ..."
          if tar -xzf "$TEMP_TAR" -C "$ZYC_DIR" 2>/dev/null; then
            tar -xzf "$TEMP_TAR" -C "$ZYC_DIR" 2>/dev/null || true
            rm -f "$TEMP_TAR"
            
            if [ -x "$ZYC_DIR/bin/clang" ]; then
                CLANG_BIN="$ZYC_DIR/bin"
                CLANG_FOUND=true
                echo "ZyC Clang successfully downloaded and extracted."
                echo "Using: $CLANG_BIN/clang"
            else
                echo "Warning: Extraction done, but clang binary not found at $ZYC_DIR/bin/clang"
            fi
          else
              echo "Error: Failed to extract the tar.gz file."
              rm -f "$TEMP_TAR"
          fi
        fi

      elif [ -n "$OP_C_COMPILER" ]; then
        if [ -x "$CONFIG_FOLDER/$OP_C_COMPILER/clang" ]; then
          CLANG_BIN="$CONFIG_FOLDER/$OP_C_COMPILER"
          CLANG_FOUND=true
        else
          echo "Warning: OP_C_COMPILER='$OP_C_COMPILER' but clang binary not found at $CONFIG_FOLDER/$OP_C_COMPILER/clang"
        fi
      fi

      if [ "$CLANG_FOUND" = false ]; then
        for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
          [ -d "$base/clang/host/linux-x86" ] || continue
          latest=$(ls -d "$base/clang/host/linux-x86/clang-r"* 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$latest" ] && [ -x "$latest/bin/clang" ]; then
            CLANG_BIN="$latest/bin"
            CLANG_FOUND=true
            break
          fi
        done
      fi

      if [ "$CLANG_FOUND" = false ] && command -v clang >/dev/null 2>&1; then
        CLANG_BIN="$(dirname "$(command -v clang)")"
        CLANG_FOUND=true
        echo "Using system clang."
      fi

      [ "$CLANG_FOUND" = true ] || { echo "::error::No clang toolchain found"; exit 1; }

      echo "CLANG_BIN_PATH=$CLANG_BIN" >> "$GITHUB_ENV"

      CLANG_VERSION="$("$CLANG_BIN/clang" --version | head -n1)"
      echo "CLANG_VERSION=$CLANG_VERSION" >> "$GITHUB_ENV"

      echo "Derive Clang fingerprint"

      short="$("${CLANG_BIN}/clang" --version | sed -n '1s/.*clang-r\([0-9.]\+\).*/\1/p')"

      if [ -z "$short" ]; then
        short="$("${CLANG_BIN}/clang" --version | sha256sum | cut -c1-8)"
        echo "⚠️ Could not extract clang-r version, using hash: $short"
      else
        echo "✅ Clang version fingerprint: $short"
      fi

      echo "CLANG_VERSION_SHORT=$short" >> "$GITHUB_ENV"
      echo "$CLANG_BIN" >> $GITHUB_PATH
      echo "LIBCLANG_PATH=$CLANG_BIN/../lib" >> "$GITHUB_ENV"

      echo "✅ Detected Clang: $CLANG_VERSION"
      echo "::endgroup::"

  - name: Check or Detect Rust & bindgen
    shell: bash
    if: ${{ env.OP_RUST_BUILD == 'true' }}
    run: |
      set -euo pipefail
      echo "::group::Detect Rust & bindgen"
      RUSTC_FOUND=false
      BINDGEN_FOUND=false

      if [ -z "$OP_RUST_COMPILER" ]; then
        for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
          [ -d "$base/rust/linux-x86" ] || continue
          latest=$(ls -d "$base/rust/linux-x86/1."* 2>/dev/null | sort -V | head -n1 || true)
          if [ -n "$latest" ] && [ -x "$latest/bin/rustc" ]; then
            RUSTC_BIN="$latest/bin"
            RUSTC_FOUND=true
            break
          fi
        done
      else
        if [ -x "$CONFIG_FOLDER/$OP_RUST_COMPILER/rustc" ]; then
          RUSTC_BIN="$CONFIG_FOLDER/$OP_RUST_COMPILER"
          RUSTC_FOUND=true
        fi
      fi

      if [ -z "$OP_BINDGEN" ]; then
        for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
          [ -d "$base/clang-tools/linux-x86" ] || continue
          if [ -x "$base/clang-tools/linux-x86/bin/bindgen" ]; then
            BINDGEN_BIN="$base/clang-tools/linux-x86/bin"
            BINDGEN_FOUND=true
            chmod +x "$base/clang-tools/linux-x86/bin/bindgen"
            break
          fi
        done
      else
        if [ -x "$CONFIG_FOLDER/$OP_BINDGEN/bindgen" ]; then
          BINDGEN_BIN="$CONFIG_FOLDER/$OP_BINDGEN"
          BINDGEN_FOUND=true
          chmod +x "$CONFIG_FOLDER/$OP_BINDGEN/bindgen"
        fi
      fi

      [ "$RUSTC_FOUND" = true ] || { echo "::error::No RUST toolchain found"; exit 1; }
      [ "$BINDGEN_FOUND" = true ] || { echo "::warning::No bindgen found"; }

      echo "RUSTC_BIN_PATH=$RUSTC_BIN" >> "$GITHUB_ENV"
      RUSTC_VERSION="$("$RUSTC_BIN/rustc" --version | head -n1)"
      echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"
      echo "RUSTC=$RUSTC_BIN/rustc" >> "$GITHUB_ENV"
      echo "$RUSTC_BIN" >> $GITHUB_PATH
      echo "✅ Detected RUSTC: $RUSTC_VERSION"

      if [ "$BINDGEN_FOUND" = true ]; then
        echo "BINDGEN_BIN_PATH=$BINDGEN_BIN" >> "$GITHUB_ENV"
        BINDGEN_VERSION="$("$BINDGEN_BIN/bindgen" --version | head -n1)"
        echo "BINDGEN_VERSION=$BINDGEN_VERSION" >> "$GITHUB_ENV"
        echo "$BINDGEN_BIN" >> $GITHUB_PATH
        echo "BINDGEN=$BINDGEN_BIN/bindgen" >> "$GITHUB_ENV"
        echo "✅ Detected BINDGEN: $BINDGEN_VERSION"
      fi

      echo "::endgroup::"

  - name: Install bindgen only (no rustc)
    shell: bash
    if: ${{ env.OP_RUST_BUILD == 'true'  && !env.BINDGEN_BIN_PATH }}
    run: |
      set -euo pipefail
      echo "::group::Install bindgen only (no rustc)"
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
      source $HOME/.cargo/env

      cargo install bindgen-cli --version 0.69.5

      BINDGEN=$(which bindgen)
      BINDGEN_BIN=$(dirname $BINDGEN)
      echo "$BINDGEN_BIN" >> $GITHUB_PATH
      echo "BINDGEN=$BINDGEN" >> "$GITHUB_ENV"

      bindgen --version
      echo "::endgroup::"

  - name: Test Rust & bindgen
    shell: bash
    if: ${{ env.OP_RUST_BUILD == 'true' }}
    run: |
      set -euo pipefail
      echo "::group::Test Rust & bindgen"
      cd "$COMMON_KERNEL_FOLDER"
      export RUSTTARGET="aarch64-linux-android"
      make V=1 rustavailable
      echo "::endgroup::"

  - name: Restore ccache cache
    id: restore-ccache-cache
    uses: ./action-source/.github/actions/cache/restore
    if: ${{ inputs.clean == false || inputs.clean == 'false' }}
    with:
      cache_path: ${{ env.CCACHE_DIR }}
      cache_key: ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}
      cache_bucket: "ccache-cache"
      debug: ${{ inputs.debug }}
      github_token: ${{ inputs.github_token }}
      restore_keys: |
        ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-
        ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-

  - name: Check and Prepare Caches
    shell: bash
    run: |
      echo "::group::Check ccache"
      set -euo pipefail

      echo "/usr/lib/ccache" >> $GITHUB_PATH

      echo "CCACHE_NOINODECACHE=true" >> $GITHUB_ENV

      echo "Current ccache configuration:"
      ccache -p

      if [ -d "$CCACHE_DIR" ] && find "$CCACHE_DIR" -type f -print -quit 2>/dev/null | grep -q .; then
        echo "✅ Restored cache found"
        echo ""
        echo "Pre-build cache statistics:"
        ccache -s | head -n 20
        
        echo "Updating atime to achive cache eviction"
        find ${{ env.CCACHE_DIR }} -type f -exec touch -t $(date -d "1 day ago" +%Y%m%d%H%M) {} +
      else
        echo "⚠️ No existing cache - building from scratch"
        echo "Cache will be populated for future builds"
      fi

      ccache -z

      echo "::endgroup::"

  - name: Fetch Build Dependencies
    shell: bash
    run: |
      echo "::group::Fetch dependencies"
      set -euo pipefail
      echo "Fetching build dependencies..."



      retry_clone() {
        local url="$1"
        local branch="${2:-main}"
        local depth="${3:-1}"
        local dir="${4:-$(basename "$url" .git)}"
        local max_attempts=3
        local attempt=1
        
        local clone_args=(--branch "$branch")
        if [ "$depth" != "0" ] && [ -n "$depth" ]; then
          clone_args+=(--depth "$depth")
        fi
        
        while [ $attempt -le $max_attempts ]; do
          echo "🔄 Attempt $attempt/$max_attempts: cloning $url ($branch)${depth:+ [depth=$depth]}"
          
          git clone "${clone_args[@]}" "$url" "$dir" && {
            echo "✅ Success"
            return 0
          }
          
          echo "❌ Failed, cleaning up..."
          rm -rf "$dir" 2>/dev/null
          sleep $((attempt++ * 5))
        done
        
        echo "💥 All attempts failed"
        return 1
      }

      retry_clone "https://github.com/WildKernels/kernel_patches.git" "main" "1"
      _pref="${{ inputs.patches_ref }}"
      retry_clone "https://github.com/Bouteillepleine/kernel_patches.git" "${_pref:-main}" "1" "bouton_kernel_patches"
      echo "kernel_patches ref: ${_pref:-main}"

      echo "BOUTEILLE_KERNEL_PATCHES_FOLDER=$GITHUB_WORKSPACE/bouton_kernel_patches" >> "$GITHUB_ENV"
      echo "BOUTEILLE_BBR3_PATCHES_FOLDER=$GITHUB_WORKSPACE/bouton_kernel_patches/common/bbrv3" >> "$GITHUB_ENV"

      if [ "${{ inputs.enable_adios }}" = "true" ]; then
        echo "ADIOS_PATCHES_FOLDER=$GITHUB_WORKSPACE/bouton_kernel_patches/experimental" >> "$GITHUB_ENV"
      fi


      echo "✅ Dependencies cloned"
      echo "::endgroup::"

  - name: Clean Up ABI Protected Exports
    shell: bash
    run: |
      echo "::group::Clean Up ABI Protected Exports"
      set -euo pipefail
      cd "$KERNEL_PLATFORM_FOLDER"
      rm -f common/android/abi_gki_protected_exports_* || true
      sed -i 's/protected_modules = \[.*\]/protected_modules = []/' common/modules.bzl || true
      echo "::endgroup::"

  - name: Add SukiSU
    shell: bash
    if: ${{ inputs.ksu_type == 'SUKISU' }}
    run: |
      set -euo pipefail
      echo "::group::Add SukiSU"

      cd "$KERNEL_PLATFORM_FOLDER"

      SUKISU_SETUP_SCRIPT="$(mktemp /tmp/rsksu_setup_XXXXXX.sh)"
      trap 'rm -f "$SUKISU_SETUP_SCRIPT"' EXIT

      KSU_INPUT="${{ inputs.ksu_branch_or_hash }}"
      SETUP_REF="${KSU_INPUT:-main}"

      echo "Downloading SukiSU setup script from $SETUP_REF..."
      if ! curl --fail --location --proto '=https' --tlsv1.2 -LSs \
        --retry 5 --retry-delay 5 --retry-all-errors \
        "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${SETUP_REF}/kernel/setup.sh" \
        -o "$SUKISU_SETUP_SCRIPT"; then
        echo "::warning::setup.sh not available at $SETUP_REF, falling back to main"
        if ! curl --fail --location --proto '=https' --tlsv1.2 -LSs \
          --retry 5 --retry-delay 5 --retry-all-errors \
          "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
          -o "$SUKISU_SETUP_SCRIPT"; then
          echo "::error::Failed to download SukiSU setup.sh after retries"
          exit 1
        fi
      fi

      SCRIPT_SIZE="$(stat -c%s "$SUKISU_SETUP_SCRIPT")"
      if [ "$SCRIPT_SIZE" -lt 512 ]; then
        echo "::error::Downloaded setup.sh is suspiciously small (${SCRIPT_SIZE} bytes). Aborting."
        exit 1
      fi

      if ! head -n1 "$SUKISU_SETUP_SCRIPT" | grep -q '^#!'; then
        echo "::error::Downloaded setup.sh does not start with a shebang. Aborting."
        exit 1
      fi

      chmod +x "$SUKISU_SETUP_SCRIPT"

      if [ -z "$KSU_INPUT" ]; then
        echo "No branch/hash provided — using default installer mode."
        bash "$SUKISU_SETUP_SCRIPT"
      else
        echo "Using SukiSU branch/hash: $KSU_INPUT"
        bash "$SUKISU_SETUP_SCRIPT" "$KSU_INPUT"
      fi

      if [ ! -d "$KERNEL_PLATFORM_FOLDER/KernelSU" ]; then
        echo "::error::KernelSU directory was not created by SukiSU setup."
        find "$KERNEL_PLATFORM_FOLDER" -maxdepth 3 -type d \( -iname "*ksu*" -o -iname "*suki*" \) || true
        exit 1
      fi
      KSU_KDIR="$KERNEL_PLATFORM_FOLDER/KernelSU/kernel"
      if [ -d "$KSU_KDIR/include" ]; then
        cp -f "$KSU_KDIR/include/"*.h "$KSU_KDIR/" 2>/dev/null || true
        if [ -f "$KSU_KDIR/Kbuild" ]; then
          printf '\nccflags-y += -I%s -I%s/include\n' "$KSU_KDIR" "$KSU_KDIR" >> "$KSU_KDIR/Kbuild"
          printf 'ccflags-y += -include linux/string.h -include %s/ksu.h\n' "$KSU_KDIR" >> "$KSU_KDIR/Kbuild"
          echo "Appended absolute kernelsu -I paths + force-include ksu.h to $KSU_KDIR/Kbuild"
        fi
      fi
      if [ -d "$KERNEL_PLATFORM_FOLDER/KernelSU/uapi" ]; then
        mkdir -p "$COMMON_KERNEL_FOLDER/include/uapi"
        cp "$KERNEL_PLATFORM_FOLDER/KernelSU/uapi/"*.h "$COMMON_KERNEL_FOLDER/include/uapi/" 2>/dev/null || true
      fi
      if [ -d "$KSU_KDIR" ]; then
        _nm_inject() {  # $1 = full extern decl text ; $2 = symbol to grep for (whole word)
          while IFS= read -r _f; do
            grep -qF "$1" "$_f" || sed -i "1i $1" "$_f"
          done < <(grep -rlw "$2" "$KSU_KDIR" --include='*.c' 2>/dev/null || true)
        }
        _nm_inject 'extern struct cred *ksu_cred;' 'ksu_cred'
        _nm_inject 'extern bool allow_shell;' 'allow_shell'
        _nm_inject 'extern bool ksu_late_loaded;' 'ksu_late_loaded'
        _nm_inject 'extern bool ksu_no_custom_rc;' 'ksu_no_custom_rc'
        while IFS= read -r _f; do
          sed -i '1i #include <linux/types.h>' "$_f"
        done < <(grep -rlwE 'allow_shell|ksu_late_loaded|ksu_no_custom_rc' "$KSU_KDIR" --include='*.c' 2>/dev/null || true)
        echo "Injected KSU externs (ksu_cred / allow_shell / ksu_late_loaded / ksu_no_custom_rc) + types.h"
      fi

      cd "$KERNEL_PLATFORM_FOLDER/KernelSU"

      KSU_COMMIT_SHA="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
      COMMITS_COUNT="$(git rev-list --count HEAD 2>/dev/null || true)"
      if [[ ! "$COMMITS_COUNT" =~ ^[0-9]+$ ]]; then
        echo "::warning::Could not determine commit count, using fallback 30000."
        COMMITS_COUNT=30000
      fi

      BASE_VERSION=37185
      KSU_VERSION=$((COMMITS_COUNT + BASE_VERSION))

      echo "SukiSU commits: $COMMITS_COUNT"
      echo "SukiSU version: $KSU_VERSION"
      echo "SukiSU commit:  $KSU_COMMIT_SHA"

      if [ -f "$KERNEL_PLATFORM_FOLDER/KernelSU/kernel/Makefile" ]; then
        sed -i "s/DKSU_VERSION=[0-9]*/DKSU_VERSION=${KSU_VERSION}/" "$KERNEL_PLATFORM_FOLDER/KernelSU/kernel/Makefile" || true
      fi

      if [ -f "$KERNEL_PLATFORM_FOLDER/KernelSU/kernel/Kbuild" ]; then
        sed -i 's#^KSU_VERSION_FULL :=.*#KSU_VERSION_FULL := v$(VERSION_TAG)-⚡Ultra⚡@SukiSU#' "$KERNEL_PLATFORM_FOLDER/KernelSU/kernel/Kbuild" || true
      fi

      {
        echo "KSU_COMMIT_SHA=$KSU_COMMIT_SHA"
        echo "KSUVER=$KSU_VERSION"
      } >> "$GITHUB_ENV"

      cd ..

      DEFCONFIG="$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
      mkdir -p "$(dirname "$DEFCONFIG")"
      touch "$DEFCONFIG"

      TAG_NAME="$(git -C KernelSU describe --tags --abbrev=0 2>/dev/null || echo v1.0.0)"

      sed -i \
        -e '/^CONFIG_KSU=/d' \
        -e '/^CONFIG_KPM=/d' \
        -e '/^CONFIG_KSU_FULL_NAME_FORMAT=/d' \
        "$DEFCONFIG" || true

      {
        printf '%s\n' 'CONFIG_KSU=y'
        printf '%s\n' 'CONFIG_KPM=n'
      } >> "$DEFCONFIG"

      {
        echo "SUKISU"
        echo "$KSU_VERSION"
      } >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"

      echo "✅ SukiSU added (commit: ${KSU_COMMIT_SHA:0:8})"
      echo "::endgroup::"

  - name: Apply NoMount (hookless) Patch
    if: ${{ env.OP_NMS == 'true' }}
    shell: bash
    env:
      NOMOUNT_REF: ${{ inputs.nomount_ref }}
    run: |
      bash "$BOUTEILLE_KERNEL_PATCHES_FOLDER/scripts/apply_nomount_stack.sh" hookless

  - name: Record NoMount Version
    if: ${{ env.OP_NMS == 'true' }}
    shell: bash
    run: |
      bash "$BOUTEILLE_KERNEL_PATCHES_FOLDER/scripts/apply_nomount_stack.sh" record-version
      bash "$BOUTEILLE_KERNEL_PATCHES_FOLDER/scripts/apply_nomount_stack.sh" hook
      bash "$BOUTEILLE_KERNEL_PATCHES_FOLDER/scripts/apply_nomount_stack.sh" ghost
      bash "$BOUTEILLE_KERNEL_PATCHES_FOLDER/scripts/apply_nomount_stack.sh" pathhide

  - name: Upgrade LZ4 (OPlus 1.10.0 + NEON)
    if: ${{ env.OP_LZ4_UPGRADE == 'true' }}
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Upgrade LZ4"
      cd "$COMMON_KERNEL_FOLDER"
      if [ -f lib/lz4/lz4.c ] && grep -q 'lib/lz4/lz4.h' include/linux/lz4.h 2>/dev/null; then
        echo "LZ4 already upgraded, skipping"
      else
        rm -rf "$GITHUB_WORKSPACE/lz4_oplus"
        git clone --depth 1 https://github.com/Numbersf/lz4_oplus.git "$GITHUB_WORKSPACE/lz4_oplus"
        bash "$GITHUB_WORKSPACE/lz4_oplus/apply_lz4_oplus.sh"
      fi
      grep -q 'lib/lz4/lz4.h' include/linux/lz4.h
      grep -q 'LZ4_arm64_decompress_safe' crypto/lz4.c
      ls lib/lz4/lz4.c lib/lz4/lz4hc.c lib/lz4/lz4armv8/lz4accel.c > /dev/null
      echo "LZ4_UPGRADED=true" >> "$GITHUB_ENV"
      echo "LZ4_SOURCE=https://github.com/Numbersf/lz4_oplus" >> "$GITHUB_ENV"
      echo "✅ LZ4 upgraded to 1.10.0 with ARM64 NEON acceleration"
      echo "::endgroup::"

  - name: Apply BoRE
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Apply BoRE scheduler"
      cd "$COMMON_KERNEL_FOLDER"
      source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
      BORE_PATCH="bore_${KERNEL_VER}.patch"
      case "$KERNEL_VER" in
        6.6|6.12) BORE_SPEC="g:kernel/sched/bore.c|sched_bore_init" ;;
        *) BORE_SPEC="g:kernel/fork.c|sched_bore_free;g:kernel/sysctl.c|sched_bore" ;;
      esac
      # Tree-exact regen patch is the PRIMARY source: pre-ported BoRE patches
      # live in scripts/patches, keyed by kernel version
      # (bore_<ver>_oneplus_regen.patch). They run through the same gen_patch
      # pipeline (stage fuzz=0 -> regen -> apply fuzz=0 -> verify), so patchgen
      # staging wins whenever a committed override exists. Bouteillepleine's
      # upstream patch targets the reworked EEVDF base and structurally cannot
      # stage on this tree, so the upstream fetch is the fallback, used only
      # when no regen patch is committed for this kernel version.
      BORE_REGEN="$GITHUB_WORKSPACE/scripts/patches/bore_${KERNEL_VER}_oneplus_regen.patch"
      [ -f "$BORE_REGEN" ] || BORE_REGEN=""
      # Fail-safe content guard: a regen patch carrying the duplicated
      # return-curr construct (added line directly above an identical
      # context line in a brace-less if) bootloops the device. Refuse it
      # rather than build an unbootable kernel.
      if [ -n "$BORE_REGEN" ] && awk '
          /^\+[[:space:]]*return curr;[[:space:]]*$/ { if ((getline nxt) > 0 && nxt ~ /^[[:space:]]*return curr;[[:space:]]*$/) { found = 1; exit } }
          END { exit !(found) }
        ' "$BORE_REGEN"; then
        echo "::warning::bore: committed regen patch matches the duplicated return-curr bootloop signature; refusing it — re-commit the corrected bore_${KERNEL_VER}_oneplus_regen.patch"
        BORE_REGEN=""
      fi
      BORE_UPSTREAM=""
      if fetch_patch "https://raw.githubusercontent.com/Bouteillepleine/kernel_patches/main/experimental/${BORE_PATCH}" /tmp/bore.patch; then
        BORE_UPSTREAM="/tmp/bore.patch"
      fi
      if [ -z "$BORE_REGEN" ] && [ -z "$BORE_UPSTREAM" ]; then
        echo "::warning::BoRE patch unavailable (${BORE_PATCH}); skipping"
        echo "bore|skipped" >> "$PS_FILE"
        echo "BORE_SKIPPED=${BORE_PATCH}" >> "$GITHUB_ENV"
        echo "::endgroup::"
        exit 0
      fi
      gen_patch_fb bore "$BORE_REGEN" "$BORE_UPSTREAM" "" "$BORE_SPEC" || true
      if [ "${GEN_PATCH_FB_VIA:-none}" = "none" ] || ! grep -Eq '^bore\|(applied|already)' "$PS_FILE" 2>/dev/null; then
        echo "BORE_SKIPPED=${BORE_PATCH}" >> "$GITHUB_ENV"
        echo "::endgroup::"
        exit 0
      fi
      if [ "$GEN_PATCH_FB_VIA" = "primary" ]; then
        echo "[patchgen] bore: landed via tree-exact regen (patchgen staging, $(basename "$BORE_REGEN"))"
        echo "BORE_VIA=patchgen-regen" >> "$GITHUB_ENV"
      else
        echo "[patchgen] bore: landed via latest-upstream ($(basename "$BORE_UPSTREAM"))"
        echo "BORE_VIA=latest-upstream" >> "$GITHUB_ENV"
      fi
      grep -q 'config SCHED_BORE' init/Kconfig
      grep -q '^CONFIG_SCHED_BORE=y' arch/arm64/configs/gki_defconfig || \
        echo 'CONFIG_SCHED_BORE=y' >> arch/arm64/configs/gki_defconfig
      grep -n 'CONFIG_SCHED_BORE' arch/arm64/configs/gki_defconfig
      echo "BORE_APPLIED=true" >> "$GITHUB_ENV"
      if [ "$GEN_PATCH_FB_VIA" = "primary" ]; then
        echo "BORE_SOURCE=scripts/patches/$(basename "$BORE_REGEN") (tree-exact regen)" >> "$GITHUB_ENV"
      else
        echo "BORE_SOURCE=https://github.com/Bouteillepleine/kernel_patches/tree/main/experimental" >> "$GITHUB_ENV"
      fi
      echo "✅ BoRE applied for ${ANDROID_VER}-${KERNEL_VER}"
      echo "::endgroup::"

  - name: Add BBG
    if: ${{ env.OP_BBG == 'true' }}
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Add BBG LSM"
      cd "$KERNEL_PLATFORM_FOLDER"
      echo "Adding BBG..."
      if ! wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash -s main; then
        echo "::warning::BBG setup script failed, continuing anyway"
      fi
      echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
      sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

      echo "✅ BBG LSM added"
      echo "::endgroup::"

  - name: Apply Other Patches
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Apply Other patches"
      cd "$COMMON_KERNEL_FOLDER"
      KERNEL_VERSION="${{ env.KERNEL_VER }}"
      MIN_VERSION="5.16"
      if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
        echo "Patching ptrace!"
        patch -p1 -F 3 < "$KERNEL_PATCHES_FOLDER/gki_ptrace.patch"
      else
        echo "Kernel >= $MIN_VERSION, skipping ptrace patch"
      fi

      if [ "$OP_HMBIRD" = true ]; then
        echo "Patching hmbird!"
        HMBIRD_MODEL=$(echo "$OP_MODEL" | sed 's/-[0-9]\+\.[0-9]\+\.[0-9]\+$//')
        case "$OP_MODEL" in
          OP-ACE-5-ULTRA-6.6.50|OP-ACE-5-PRO-6.6.30|OP13-6.6.30|OP13-CPH-6.6.56|OP13T-6.6.89|OP13-6.6.89|OP-ACE-5-PRO-6.6.89)
            FENGCHI_DIR="$KERNEL_PATCHES_FOLDER/oneplus/hmbird/deprecated" ;;
          *)
            FENGCHI_DIR="$KERNEL_PATCHES_FOLDER/oneplus/hmbird" ;;
        esac
        FENGCHI_PATCH="$FENGCHI_DIR/fengchi_${HMBIRD_MODEL}_${OP_OS_VERSION}.patch"
        dos2unix "$FENGCHI_PATCH"
        FENGCHI_PATCH_FIXED="$(mktemp)"
        awk '
          function flush(){ if (buf != "" && buf !~ /ANDROID_KABI_USE\(1, unsigned long sched_prop\)/) printf "%s", buf; buf="" }
          /^@@ /{ flush(); buf=$0 ORS; next }
          /^diff --git/{ flush(); print; next }
          { if (buf=="") print; else buf=buf $0 ORS }
          END{ flush() }
        ' "$FENGCHI_PATCH" > "$FENGCHI_PATCH_FIXED"
        FENGCHI_PATCH="$FENGCHI_PATCH_FIXED"
        patch -p1 -F 3 < "$FENGCHI_PATCH"
        dos2unix "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/overwriter.patch"
        patch -p1 -F 3 < "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/overwriter.patch"
        chmod +x ./drivers/of/overwriter/overwrite_configs/convert_configs.sh
        dos2unix "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/hmbird_config.patch"
        patch -p1 -F 3 < "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/hmbird_config.patch"
      else
        echo "Hmbird not enabled, skipping fengchi patch"
      fi

      echo "✅ Other patches applied"
      echo "::endgroup::"

  - name: Apply Optimisation Patches
    if: ${{ env.OP_OPT == 'true' }}
    shell: bash
    run: |
      set -euo pipefail
      echo "::group::Apply Optimisation patches"
      cd "$COMMON_KERNEL_FOLDER"
      KERNEL_VERSION="${{ env.KERNEL_VER }}"
      MIN_VERSION="5.16"
      patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/optimized_mem_operations.patch"
      patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/file_struct_8bytes_align.patch"
      patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/reduce_cache_pressure.patch"

      patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/mem_opt_prefetch.patch"

      if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/optimise_memcmp.patch"
      elif [ "$(printf '%s\n' "$KERNEL_VERSION" "5.11" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
        sed -e 's/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/' -e 's/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/' -e 's/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/' "$KERNEL_PATCHES_FOLDER/common/optimise_memcmp.patch" | patch -p1 --forward
      else
        echo "Optimised memcmp patch not found!"
      fi
      patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/minimise_wakeup_time.patch"
      patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/int_sqrt.patch"
      patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/force_tcp_nodelay.patch"
      patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/reduce_gc_thread_sleep_time.patch"
      patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/add_timeout_wakelocks_globally.patch"
      patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/f2fs_reduce_congestion.patch"
      patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/reduce_freeze_timeout.patch"

      if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/clear_page_16bytes_align.patch"
      else
        cat "$KERNEL_PATCHES_FOLDER/common/clear_page_16bytes_align.patch" | sed -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' | patch -p1 -F3 --forward
      fi

      echo "Patching add_limitation_scaling_min_freq.patch"
      patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/add_limitation_scaling_min_freq.patch"
      echo "Patching re_write_limitation_scaling_min_freq.patch"
      patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/re_write_limitation_scaling_min_freq.patch"
      echo "Patching adjust_cpu_scan_order.patch"
      patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/adjust_cpu_scan_order.patch"
